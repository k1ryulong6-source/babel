// 环形进度
// 巴比伦六十进制楔形数字：个位是竖楔叠加，十位是角楔叠加
const BAB_ONES = ["", "𒁹", "𒈫", "𒐈", "𒐉", "𒐊", "𒐋", "𒐌", "𒐍", "𒐎"], BAB_TENS = ["", "𒌋", "𒎙", "𒌍", "𒐏", "𒐐"];
function babNum(n) {
  n = Math.floor(n || 0); if (n <= 0) return "";
  const places = []; while (n > 0) { const d = n % 60; places.unshift(d ? BAB_TENS[Math.floor(d / 10)] + BAB_ONES[d % 10] : "　"); n = Math.floor(n / 60); }
  return places.join(" ");
}
const bab = (n, cls = "") => { const t = babNum(n); return t ? `<span class="bab cun ${cls}" title="巴比伦六十进制：${n}">${t}</span>` : ""; };
// 数字格：大号数字 + 一条细进度线（替代圆环）
function ring(frac, { html = "" } = {}) {
  const f = Math.max(0, Math.min(1, frac || 0));
  return `<div class="ring"><div class="in">${html}</div><div class="rb"><i style="width:${(f * 100).toFixed(1)}%"></i></div></div>`;
}
const confetti = () => `<div class="confetti">${[...Array(28)].map((_, i) => `<i style="left:${(i * 37) % 100}%;background:${["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--gold)"][i % 6]};animation-delay:${(i % 7) * .08}s;animation-duration:${1.4 + (i % 5) * .2}s"></i>`).join("")}</div>`;
const spkBtn = (text, extra = "") => isJa() ? "" : `<button class="spk" data-say="${esc(text)}" ${extra} aria-label="朗读 ${esc(text)}">${ICON.spk}</button>`;

/* ============ 存储：优先云端 db；没有云端时存本机 IndexedDB（App 版），再不行退回 localStorage ============ */
const IDB = {
  open() { return new Promise((ok, no) => { const r = indexedDB.open("babel", 1); r.onupgradeneeded = () => r.result.createObjectStore("docs"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  run(db, mode, fn) { return new Promise((ok, no) => { const t = db.transaction("docs", mode), req = fn(t.objectStore("docs")); t.oncomplete = () => ok(req && "result" in req ? req.result : undefined); t.onerror = () => no(t.error); t.onabort = () => no(t.error); }); }
};
// 触屏设备：不显示键盘快捷键提示
const TOUCH = typeof matchMedia === "function" && matchMedia("(hover: none), (pointer: coarse)").matches;
document.addEventListener("keydown", e => { if (!e.isComposing && e.key && e.key.length <= 6 && !document.documentElement.classList.contains("kb")) document.documentElement.classList.add("kb"); }, { capture: true });
const Store = {
  db: null, idb: null, mode: "local",
  async init() {
    try { if (window.claude?.use) { const db = await window.claude.use("db"); if (db) { this.db = db; this.mode = "cloud"; } } } catch (e) { }
    if (!this.db && window.indexedDB) {
      try { this.idb = await IDB.open(); await this._fromLS(); navigator.storage?.persist?.().catch(() => { }); } catch (e) { this.idb = null; }
    }
  },
  // 以前存在 localStorage 里的记录复制一份进 IndexedDB（只复制，不删原来的）
  async _fromLS() {
    try { if (localStorage.getItem("bt_idb_from_ls")) return; } catch { return; }
    const docs = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("sj:")) docs.push([k.slice(3), JSON.parse(localStorage.getItem(k))]); } } catch { }
    if (docs.length) await IDB.run(this.idb, "readwrite", st => { for (const [k, v] of docs) st.put(v, k); });
    try { localStorage.setItem("bt_idb_from_ls", "1"); } catch { }
  },
  k: p => "sj:" + p,
  async get(p) {
    if (this.db) { const s = await this.db.doc(p).get(); return s.exists ? clone(s.data()) : null; }
    if (this.idb) { const v = await IDB.run(this.idb, "readonly", st => st.get(p)); return v === undefined ? null : v; }
    try { const v = localStorage.getItem(this.k(p)); return v ? JSON.parse(v) : null; } catch { return null; }
  },
  async set(p, data) {
    if (this.db) return this.db.doc(p).set(data);
    if (this.idb) { try { await IDB.run(this.idb, "readwrite", st => st.put(clone(data), p)); } catch (e) { toast("本机存储空间不足，部分数据未保存"); } return; }
    try { localStorage.setItem(this.k(p), JSON.stringify(data)); } catch (e) { toast("本机存储空间不足，部分数据未保存"); }
  },
  async del(p) {
    if (this.db) return this.db.doc(p).delete();
    if (this.idb) return IDB.run(this.idb, "readwrite", st => st.delete(p));
    try { localStorage.removeItem(this.k(p)); } catch { }
  },
  async list(coll) {
    if (this.db) { const q = await this.db.collection(coll).get(); return q.docs.map(d => ({ _id: d.id, ...clone(d.data()) })); }
    if (this.idb) {
      const out = [], pre = coll + "/";
      await new Promise((ok, no) => {
        const t = this.idb.transaction("docs", "readonly"), c = t.objectStore("docs").openCursor(IDBKeyRange.bound(pre, pre + "\uffff"));
        c.onsuccess = () => { const cur = c.result; if (!cur) return; const id = String(cur.key).slice(pre.length); if (!id.includes("/")) out.push({ _id: id, ...cur.value }); cur.continue(); };
        t.oncomplete = ok; t.onerror = () => no(t.error);
      });
      return out;
    }
    const out = [], pre = this.k(coll + "/");
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(pre) && !k.slice(pre.length).includes("/")) out.push({ _id: k.slice(pre.length), ...JSON.parse(localStorage.getItem(k)) });
      }
    } catch { }
    return out;
  }
};

// 合并写入：同一文档一次只写一次，连续修改合并
const Saver = {
  dirty: new Map(), timer: null, busy: false, again: false,
  mark(path, getter) { this.dirty.set(path, getter); setSync("saving"); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 700); },
  async flush() {
    if (this.busy) { this.again = true; return; }
    this.busy = true; clearTimeout(this.timer);
    try {
      while (this.dirty.size) {
        const [p, g] = this.dirty.entries().next().value;
        this.dirty.delete(p);
        try { await Store.set(p, g()); }
        catch (e) {
          if (e?.code === "unavailable") { await sleep(700 + Math.random() * 900); try { await Store.set(p, g()); } catch { toast("保存失败，稍后会重试"); this.dirty.set(p, g); break; } }
          else if (e?.code === "quota_exceeded") toast("云端存储已满：请删除一些词表或文章后再试");
          else if (e?.code === "revoked" || e?.code === "not_granted") { toast("云端存档不可用"); }
          else console.warn("save", p, e);
        }
      }
    } finally {
      this.busy = false; setSync();
      if (this.again) { this.again = false; this.flush(); }
    }
  }
};
document.addEventListener("visibilitychange", () => { if (document.hidden) Saver.flush(); });

function setSync(state) {
  const el = $("#sync"); if (!el) return;
  const m = state === "saving" ? ["saving", "保存中…"] : Store.mode === "cloud" ? ["cloud", "云端存档"] : ["local", Store.idb ? "存在本机" : "仅存本机"];
  el.className = "sync " + m[0]; el.querySelector("span").textContent = m[1];
  el.title = Store.mode === "cloud" ? "学习记录保存在云端，换设备打开同一链接即可继续" : Store.idb ? "学习记录保存在这台手机里；在「设置 → 存档」里可以导出备份" : "当前环境无法连接云端，记录只保存在这个浏览器里";
}

function dayLog(k = today()) { S.log.days[k] ||= {}; return S.log.days[k]; }
function bump(field, n = 1) { const d = dayLog(); d[field] = (d[field] || 0) + n; saveLog(); }
function sumDays(field, n = 7) { let s = 0; for (let i = 0; i < n; i++) s += (S.log.days[addDays(today(), -i)]?.[field] || 0); return s; }
function sumAll(field) { let s = 0; for (const d of Object.values(S.log.days)) s += d[field] || 0; return s; }
function activity(d) { if (!d) return 0; return (d.nw || 0) + (d.rv || 0) + (d.gq || 0) + (d.rq || 0) + (d.lq || 0) + (d.dl || 0) + (d.ch || 0) + Math.round((d.ls || 0) / 60); }

// 打卡日历：英语、日语、西语共用（各自的记录不动，显示时取并集）
const isCk = k => !!(S.log.days[k]?.ck || S.ckOther?.has(k));
function streak() {
  let k = today(), n = 0;
  if (!isCk(k)) k = addDays(k, -1);
  while (isCk(k)) { n++; k = addDays(k, -1); }
  return n;
}

const LEX = { books: {}, e: {}, low: new Map(), bookOf: new Map(), ready: false };
async function loadLexicon() {
  const r = await fetch(LANG().words); if (!r.ok) throw new Error("words " + r.status);
  const j = await r.json(); LEX.books = j.books; LEX.e = j.e;
  if (LANG().books) BOOK_ORDER = LANG().books;
  // 日语文型：不进塔，但可以加入复习
  if (j.bunkei) { LEX.bunkei = j.bunkei; for (const [w, rd, zh, ja, jz, c, n] of j.bunkei) { LEX.e[w] = [rd, [["文型", zh]], ja ? [[ja, jz]] : [], "文型", c, n]; LEX.low.set(w.toLowerCase(), w); LEX.bookOf.set(w.toLowerCase(), "bk"); } }
  await mergePacks();
  for (const b of BOOK_ORDER) (LEX.books[b] || []).forEach((w, i) => { const k = w.toLowerCase(); LEX.low.set(k, w); LEX.bookOf.set(k, b); });
  LEX.ready = true;
}
// 内容包：追加例句、追加新词（不覆盖已有词条）
async function mergePacks() {
  if (!Packs.idx) await Packs.init();
  const lang = curLang();
  for (const p of Packs.list(lang, "examples")) {
    const j = await Packs.json(p); if (!j) continue;
    for (const [w, xs] of Object.entries(j)) { const e = LEX.e[w]; if (!e) continue; const seen = new Set(e[2].map(x => x[0])); for (const x of xs) if (!seen.has(x[0])) { e[2].push(x); seen.add(x[0]); } }
  }
  for (const p of Packs.list(lang, "words")) {
    const j = await Packs.json(p); if (!j) continue;
    for (const [w, e] of Object.entries(j.e)) if (!LEX.e[w]) LEX.e[w] = e;
    for (const [b, ws] of Object.entries(j.books)) LEX.books[b] = [...new Set([...(LEX.books[b] || []), ...ws])];
  }
}
function bookWords(b) {
  if (b === "my") return S.my.chunks.flatMap(c => c.words.filter(w => !w.lvl).map(w => w.w));
  if (isEs() && (b === "a2" || b === "b1")) return [...(LEX.books[b] || []), ...S.my.chunks.flatMap(c => c.words.filter(w => w.lvl === b.toUpperCase() && !LEX.low.has(w.w.toLowerCase())).map(w => w.w))];
  return LEX.books[b] || [];
}
// 统一的词条对象：{w, p, s:[[词性, 释义]], x:[[英, 中]], t?, book}
function wordInfo(w) {
  const k = String(w).toLowerCase();
  const hw = LEX.low.get(k);
  if (hw) { const [p, s, x, t, c, n] = LEX.e[hw]; return { w: hw, p, s, x, t, c, n, book: LEX.bookOf.get(k) }; }
  const m = S.my.map.get(k);
  return m ? { s: [], x: [], ...m, book: m.lvl ? m.lvl.toLowerCase() : "my" } : null;
}
const senseText = (info, max = 3) => (info?.s || []).slice(0, max).map(([p, z]) => (p ? p + " " : "") + z).join("；") || "（暂无释义）";
const firstSense = info => { const s = info?.s?.[0]; return s ? (s[0] ? s[0] + " " : "") + s[1].split("；").slice(0, 2).join("；") : "（暂无释义）"; };
function addMyWord(entry) {
  const k = entry.w.toLowerCase(); if (LEX.low.has(k) || S.my.map.has(k)) return false;
  let ci = S.my.chunks.length - 1;
  if (ci < 0 || S.my.chunks[ci].words.length >= MY_CHUNK) { S.my.chunks.push({ words: [] }); ci++; }
  const w = { w: entry.w, p: entry.p || "", s: entry.s || [], x: entry.x || [], src: entry.src || "", at: today(), ...(entry.lvl ? { lvl: entry.lvl } : {}), ...(entry.kind ? { kind: entry.kind } : {}), ...(entry.c ? { c: entry.c } : {}), ...(entry.n ? { n: entry.n } : {}) };
  S.my.chunks[ci].words.push(w); S.my.map.set(k, w); Saver.mark(nsPath("mywords/") + ci, () => S.my.chunks[ci]);
  return true;
}
function updateMyWord(w, patch) {
  const k = w.toLowerCase(); const ci = S.my.chunks.findIndex(c => c.words.some(x => x.w.toLowerCase() === k)); if (ci < 0) return;
  const it = S.my.chunks[ci].words.find(x => x.w.toLowerCase() === k); Object.assign(it, patch); S.my.map.set(k, it);
  Saver.mark(nsPath("mywords/") + ci, () => S.my.chunks[ci]);
}
function removeMyWord(w) {
  const k = w.toLowerCase(); const ci = S.my.chunks.findIndex(c => c.words.some(x => x.w.toLowerCase() === k)); if (ci < 0) return;
  S.my.chunks[ci].words = S.my.chunks[ci].words.filter(x => x.w.toLowerCase() !== k); S.my.map.delete(k);
  Saver.mark(nsPath("mywords/") + ci, () => S.my.chunks[ci]);
}

/* ---- 记忆进度：按词存，分 32 个文档 ---- */
// 记录 [阶段, 下次复习日, 答对次数, 答错次数, 上次复习日, 首次学习日]
const bucketOf = k => parseInt(fnv(k), 16) % NB;
function prog(w) { const k = String(w).toLowerCase(); return S.wp[bucketOf(k)]?.m[k] || null; }
function setProg(w, rec) { const k = String(w).toLowerCase(); const b = bucketOf(k); S.wp[b].m[k] = rec; Saver.mark(nsPath("wp/") + b, () => S.wp[b]); }
function* allProg() { for (const b of S.wp) for (const k in b.m) yield [k, b.m[k]]; }
function bookStats(b) {
  const t = today(); let learned = 0, mastered = 0, due = 0; const ws = bookWords(b);
  for (const w of ws) { const r = prog(w); if (!r) continue; learned++; if (r[0] >= MASTER_STAGE) mastered++; if (r[1] <= t) due++; }
  return { total: ws.length, learned, mastered, due };
}
function totalDue() { const t = today(); let n = 0; for (const [k, r] of allProg()) if (r[1] <= t && (LEX.low.has(k) || S.my.map.has(k))) n++; return n; }
function clearProg(w) { const k = String(w).toLowerCase(); const b = bucketOf(k); if (S.wp[b].m[k]) { delete S.wp[b].m[k]; Saver.mark(nsPath("wp/") + b, () => S.wp[b]); } }
function totalLearned() { let n = 0, m = 0; for (const [k, r] of allProg()) { if (k.startsWith("cj:")) continue; n++; if (r[0] >= MASTER_STAGE) m++; } return { learned: n, mastered: m }; }
function dueWords() {
  const t = today(), out = [];
  for (const [k, r] of allProg()) if (r[1] <= t && (LEX.low.has(k) || S.my.map.has(k))) out.push(LEX.low.get(k) || S.my.map.get(k).w);
  return out;
}
function nextNewWords(book, n) {
  const out = [];
  for (const w of bookWords(book)) { if (!prog(w)) { out.push(w); if (out.length >= n) break; } }
  return out;
}
// 评分：0 忘了 · 1 模糊 · 2 记得 · 3 太简单
function applyRating(w, r, countStats = true) {
  const t = today(); const rec = prog(w) || [0, t, 0, 0, t, t];
  let st = rec[0];
  if (r === 0) { st = 1; rec[3]++; }
  else if (r === 1) { st = Math.max(1, st); rec[2]++; }
  else if (r === 2) { st = Math.min(st + 1, MASTER_STAGE); rec[2]++; }
  else { st = Math.min(Math.max(st + 2, 3), MASTER_STAGE); rec[2]++; }
  const iv = r === 1 ? Math.max(1, Math.round(INTERVALS[st] / 2)) : INTERVALS[st];
  rec[0] = st; rec[1] = addDays(t, iv); rec[4] = t; if (!rec[5]) rec[5] = t;
  setProg(w, rec);
  if (countStats) { bump("rv"); if (r >= 1) bump("rvOk"); }
}
// 新词毕业进入复习：first = 首次评分
function graduate(w, first) {
  const t = today();
  if (first === 3) { setProg(w, [MASTER_STAGE, addDays(t, INTERVALS[MASTER_STAGE]), 1, 0, t, t]); return; }
  const st = first === 2 ? 2 : 1;
  setProg(w, [st, addDays(t, INTERVALS[st]), 1, first === 0 ? 1 : 0, t, t]);
}

function rateCard(r, oops) {
  const s = WS.sess; const it = s.q[s.pos]; const w = it.w;
  if (it.k === "study") {
    const st = s.info.get(w) || { first: r, steps: 0, done: 0 };
    if (oops) { if (st.first === 3) { clearProg(w); s.learned--; } st.first = 0; st.steps = 3; it.rated = 0; s.wrong.add(w); insertLater({ w, k: "quiz", type: "en2zh", learn: true }, 2); s.info.set(w, st); return sessNext(); }
    if (!s.info.has(w)) bump("nw");
    st.first = r; s.info.set(w, st);
    if (r === 3) { graduate(w, 3); s.learned++; }
    else { st.steps = [3, 2, 1][r]; insertLater({ w, k: "quiz", type: fixType(w, r === 0 ? "en2zh" : Math.random() < .5 ? "audio" : "en2zh"), learn: true }, r === 0 ? 2 : 3); }
    it.rated = r;
    if (s.back) return sessNext();
    s.back = true; render(); return;
  }
  // 复习卡片
  if (oops) { applyRating(w, 0, false); s.wrong.add(w); insertLater({ w, k: "card", relearn: true }, 3); return sessNext(); }
  if (!it.relearn) { applyRating(w, r); s.stats.n++; if (r >= 1) s.stats.ok++; }
  if (r === 0) s.wrong.add(w);
  if (r <= 1 && (it.tries || 0) < 3) insertLater({ w, k: "card", relearn: true, tries: (it.tries || 0) + 1 }, 3);

}

function answerSpell(input) {
  const s = WS.sess; if (s.ans) return; const it = s.q[s.pos];
  const norm = x => String(x).trim().toLowerCase().replace(/[’']/g, "'").replace(/[\s-]+/g, " ");

}
function gradeQuiz(it, a) {
  const s = WS.sess; s.ans = a; const w = it.w;
  if (!a.ok) s.wrong.add(w);
  if (it.learn) {
    const st = s.info.get(w);
    if (a.ok) {

      else insertLater({ w, k: "quiz", type: fixType(w, st.done >= 2 ? (Math.random() < .5 ? "spell" : "cloze") : st.done === 1 ? (Math.random() < .5 ? "zh2en" : "cloze") : "audio"), learn: true }, 4 + st.done * 2);
    } else { st.steps = Math.min(st.steps + 1, 3); insertLater({ w, k: "quiz", type: fixType(w, "en2zh"), learn: true }, 2); }
  } else if (s.kind === "review" && !it.relearn) {
    s.stats.n++;

}

  return text.trim().split(/\n\s*\n/).map(p => "<p>" + p.split(/([A-Za-z]+(?:['’-][A-Za-z]+)*)/).map((m, i) => {
    if (i % 2 === 0) return esc(m).replace(/_{2,}\((\d+)\)_{2,}/g, '<span class="blank">($1)</span>').replace(/\n/g, "<br>");

function lemmaGuess(w) {
  w = w.toLowerCase().replace(/’/g, "'").replace(/'s$/, "");
  const c = [w];
  if (w.endsWith("ies")) c.push(w.slice(0, -3) + "y");
  if (w.endsWith("es")) c.push(w.slice(0, -2));
  if (w.endsWith("s")) c.push(w.slice(0, -1));
  if (w.endsWith("ied")) c.push(w.slice(0, -3) + "y");
  if (w.endsWith("ed")) { c.push(w.slice(0, -2), w.slice(0, -1)); if (/(.)\1ed$/.test(w)) c.push(w.slice(0, -3)); }
  if (w.endsWith("ing")) { c.push(w.slice(0, -3), w.slice(0, -3) + "e"); if (/(.)\1ing$/.test(w)) c.push(w.slice(0, -4)); }

const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* ---- 分词 ---- */
function segWords(text, lang) {
  const L = READER_LANGS[lang] || READER_LANGS.en;
  if (L.seg && window.Intl?.Segmenter) return [...new Intl.Segmenter(L.seg, { granularity: "word" }).segment(text)].map(x => ({ t: x.segment, w: !!x.isWordLike }));

const tokHTML = (text, lang) => lang === "ja" ? jaHTML(text) : segWords(text, lang).map(x => x.w ? `<span class="wd" data-w="${esc(x.t)}">${esc(x.t)}</span>` : esc(x.t).replace(/\n/g, "<br>")).join("");
const sentencesOf = text => String(text).replace(/\s+/g, " ").split(/(?<=[.!?。！？])\s*/).map(s => s.trim()).filter(Boolean);

/* ---- 本地识别：词书和生词本里的多词条目（动词会还原时态） ---- */
const IRR = { be: ["is", "am", "are", "was", "were", "been", "being"], take: ["took", "taken"], make: ["made"], get: ["got", "gotten"], go: ["went", "gone"], come: ["came"], give: ["gave", "given"], run: ["ran"], keep: ["kept"], hold: ["held"], bring: ["brought"], think: ["thought"], find: ["found"], leave: ["left"], break: ["broke", "broken"], fall: ["fell", "fallen"], stand: ["stood"], see: ["saw", "seen"], pay: ["paid"], say: ["said"], tell: ["told"], send: ["sent"], lay: ["laid"], lead: ["led"], deal: ["dealt"], catch: ["caught"], wear: ["wore", "worn"], write: ["wrote", "written"], speak: ["spoke", "spoken"], draw: ["drew", "drawn"], grow: ["grew", "grown"], throw: ["threw", "thrown"], put: [], set: [], cut: [], shut: [], let: [], have: ["has", "had", "having"], do: ["does", "did", "done", "doing"] };
function verbForms(v) {
  const f = new Set([v, ...(IRR[v] || [])]);

// 本地粗分：动词+副词小品词、介词/连词开头的 → 短语；动词+名词、动词+介词、形容词+介词、形容词+名词 → 固定搭配
const PARTICLES = new Set(["up", "down", "out", "off", "over", "away", "back", "through", "around", "along", "into", "apart", "aside", "forward"]);
const FUNC_START = new Set(["in", "on", "at", "by", "for", "with", "as", "of", "to", "from", "under", "out", "ahead", "instead", "according", "due", "so", "such", "even", "no", "all", "at"]);
function phraseType(parts, isVerb) {

}
let _phraseIdx = null;
function phraseIndex() {

  };

  for (const m of S.my.map.values()) add(m.w);
  return (_phraseIdx = list);
}
// 日语：词书里的惯用句/谚语；文中出现的词书词条的常用搭配
function jaPhraseIndex(text) {
  const out = [];
  const pat = w => { w = w.replace(/^〜/, "").replace(/^[をがにでとはもの]/, "").trim(); if (w.length < 3) return null; const endV = /[うくぐすつぬぶむるい]$/.test(w) && KJ.test(w); return new RegExp(escRe(endV ? w.slice(0, -1) : w) + (endV ? "[ぁ-ゖ]{0,4}" : ""), "g"); };

    const info = wordInfo(w); if (!/慣用句|諺/.test(info?.t || "") || !KJ.test(w)) continue;
    const re = pat(w); if (re && re.test(text)) out.push({ base: w, re: new RegExp(re.source, "g"), type: "phr", zh: firstSense(info).replace(/^\S+ /, ""), local: true });
  }
  for (const b of ["j1", "j2"]) for (const w of bookWords(b)) {

function allMarks(a) {
  const out = [];
  const L = READER_LANGS[a.lang] || READER_LANGS.en;

    if (!m.text) continue;
    const body = m.text.trim().split(/\s+/).map(escRe).join("\\s+");
    out.push({ ...m, re: new RegExp(latin ? `(?<![\\p{L}])${body}(?![\\p{L}])` : body, latin ? "giu" : "g") });

    const ai = out.map(m => " " + (m.base || m.text).toLowerCase() + " ");

}

  const ranges = [];

    pos = e0;

  if (ja && sent) { const k = m.text ? sent.indexOf(m.text) : -1; hi = k >= 0 ? jaHTML(sent.slice(0, k)) + `<mark>${jaHTML(m.text)}</mark>` + jaHTML(sent.slice(k + m.text.length)) : jaHTML(sent); }

async function extractMarks(id) {
  const a = S.content[id]; if (!a || !aiOK()) return;
  const st = () => $("#a-st");
  const L = READER_LANGS[a.lang] || READER_LANGS.en;
  const paras = a.text.split(/\n\s*\n/); const chunks = []; let cur = "";

  const found = new Map((a.marks || []).map(m => [(m.base || m.text).toLowerCase(), m]));
  try {
    for (let i = 0; i < chunks.length; i++) {
      if (st()) st().innerHTML = `<span class="thinking">正在标注搭配和短语 ${i + 1} / ${chunks.length}</span>`;
      const r = await aiJSON(a.lang === "ja" ? JA_EXTRACT(chunks[i]) : `You help a Chinese learner (weak foundation, preparing for TOEIC) who finds collocations hard. From the ${L.name === "英语" ? "English" : L.name} text below, list the multi-word expressions worth learning and classify each one:
- "col" (固定搭配): words that habitually go together; the meaning is transparent but swapping a word sounds wrong (make a decision, pay attention, heavy traffic, take a seat, meet a deadline, highly recommended, depend on, responsible for).
- "phr" (短语): phrasal verbs, idioms and fixed prepositional phrases whose meaning works as a unit (look into, carry out, in charge of, on behalf of, as soon as, run out of).
Rules: "text" must be copied exactly as it appears in the text (same inflection, 2-6 words). Skip trivial combinations like "the company". At most 25 items.
Reply with only JSON: {"items":[{"text":"...","base":"dictionary form","type":"col or phr","sub":"结构：动词+名词 / 形容词+名词 / 副词+形容词 / 动词+介词 / 形容词+介词 / 短语动词 / 介词短语 / 习语","zh":"简体中文意思","note":"一句简体中文提醒：为什么这么搭配，或常见的错误说法（可空）"}]}
Text:
"""${chunks[i]}"""`, { cache: false });
      for (const it of (Array.isArray(r?.items) ? r.items : [])) {
        if (!it?.text || !a.text.toLowerCase().includes(String(it.text).toLowerCase())) continue;
        const k = String(it.base || it.text).toLowerCase(); if (found.has(k)) continue;
        found.set(k, { text: String(it.text), base: String(it.base || it.text), type: it.type === "col" ? "col" : "phr", sub: String(it.sub || ""), zh: String(it.zh || ""), note: String(it.note || "") });
      }
    }
    a.marks = [...found.values()]; saveContent(id);

    toast(`标出 ${a.marks.length} 处搭配和短语`);
  } catch (e) { if (st()) st().textContent = aiErr(e); }
}

const CH_MAX = 40000;
function splitChapters(text, fallbackTitle) {
  text = text.replace(/\r\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  const re = /^(第[〇一二三四五六七八九十百零0-9]+[章回节話话部篇卷]|chapter\s+\w+|cap[ií]tulo\s+\w+|CHAPTER\s+\w+|CAPÍTULO\s+\w+|[IVXLC]+\.?\s*$)[^\n]{0,40}$/gim;
  const marks = []; let m; while ((m = re.exec(text))) marks.push({ i: m.index, t: m[0].trim() });
  let parts = [];
  if (marks.length >= 2) { if (marks[0].i > 200) parts.push({ title: "前言", text: text.slice(0, marks[0].i) }); marks.forEach((k, j) => parts.push({ title: k.t, text: text.slice(k.i + k.t.length, j + 1 < marks.length ? marks[j + 1].i : text.length) })); }
  else parts = [{ title: fallbackTitle, text }];
  // 太长的章节再按段落切开
  const out = [];
  for (const p of parts) {
    if (p.text.length <= CH_MAX) { if (p.text.trim()) out.push({ title: p.title, text: p.text.trim() }); continue; }
    const paras = p.text.split(/\n\s*\n/); let cur = "", k = 1;
    for (const para of paras) { if ((cur + para).length > CH_MAX && cur) { out.push({ title: `${p.title}（${k++}）`, text: cur.trim() }); cur = ""; } cur += para + "\n\n"; }
    if (cur.trim()) out.push({ title: k > 1 ? `${p.title}（${k}）` : p.title, text: cur.trim() });
  }
  return out;
}
async function readEpub(buf) {
  await needLib("jszip");

  const opfPath = cont.match(/full-path="([^"]+)"/)[1]; const base = opfPath.includes("/") ? opfPath.replace(/[^/]+$/, "") : "";
  const opf = new DOMParser().parseFromString(await zip.file(opfPath).async("text"), "application/xml");
  const title = opf.querySelector("title")?.textContent || "";
  const man = {}; opf.querySelectorAll("manifest > item").forEach(it => man[it.getAttribute("id")] = it.getAttribute("href"));
  const chapters = [];
  for (const ref of opf.querySelectorAll("spine > itemref")) {
    const href = man[ref.getAttribute("idref")]; if (!href) continue;
    const f = zip.file(decodeURIComponent(base + href)); if (!f) continue;
    const doc = new DOMParser().parseFromString(await f.async("text"), "text/html");
    const t = doc.querySelector("h1,h2,h3,title")?.textContent.trim() || `第 ${chapters.length + 1} 部分`;
    const body = [...doc.querySelectorAll("h1,h2,h3,h4,p,li,blockquote")].map(n => n.textContent.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n\n");
    if (body.length > 80) for (const c of splitChapters(body, t)) chapters.push({ title: c.title === t || c.title.startsWith(t) ? c.title : t, text: c.text });
  }

}
async function readPdf(buf, onProg) {

  let text = "";

    for (const it of tc.items) { const y = it.transform?.[5]; if (lastY != null && Math.abs(y - lastY) > 2) { text += line.trim() + "\n"; line = ""; } line += it.str + (it.hasEOL ? "\n" : ""); lastY = y; }

  text = text.replace(/([^\n。．.!?！？」』”])\n(?!\n)/g, (m, a) => a + (/[A-Za-zÀ-ÿ,;]$/.test(a) ? " " : ""));

}

function esLemma(w) {
  const k = w.toLowerCase(); const c = [k];
  if (/es$/.test(k)) c.push(k.slice(0, -2)); if (/s$/.test(k)) c.push(k.slice(0, -1));
  if (/a$/.test(k)) c.push(k.slice(0, -1) + "o"); if (/as$/.test(k)) c.push(k.slice(0, -2) + "o");
  if (/ces$/.test(k)) c.push(k.slice(0, -3) + "z");
  return c.map(x => LEX.low.get(x) || (S.my.map.get(x) && S.my.map.get(x).w)).find(Boolean) || null;
}

// 穆德哈尔式塔楼：A1 / A2 / B1 三段，按进度从下往上填满；马蹄形拱窗，顶上是风向标
function towerSVGEs(lv) {
  const W = 420, H = 470, G = H - 30, cx = W / 2;
  const tiers = [[150, 150], [130, 120], [110, 100]]; // [宽, 高]
  const ln = "rgba(245,240,230,.9)", faint = "rgba(245,240,230,.3)";
  let y = G, out = "", defs = "";
  defs += `<pattern id="sebka" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0 L16 8 L8 16Z" fill="none" stroke="rgba(245,240,230,.35)" stroke-width="1"/></pattern>`;
  defs += `<pattern id="fillp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v6" stroke="rgba(227,162,26,.85)" stroke-width="2.4"/></pattern>`;
  const arch = (x, yb, w, h) => `M${x} ${yb} v${-h * .55} a${w / 2} ${w / 2 * 1.05} 0 1 1 ${w} 0 v${h * .55}`;
  lv.forEach(([name, c, t], i) => {
    const [w, h] = tiers[i]; const x = cx - w / 2; const top = y - h; const frac = Math.min(1, c / t);
    defs += `<clipPath id="cl${i}"><rect x="${x}" y="${(y - h * frac).toFixed(1)}" width="${w}" height="${(h * frac).toFixed(1)}"/></clipPath>`;
    out += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="url(#sebka)" stroke="${ln}" stroke-width="1.2"/>`;
    out += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="url(#fillp)" clip-path="url(#cl${i})"/>`;
    const aw = w * .22, ah = h * .5; const n = i === 0 ? 2 : i === 1 ? 2 : 1;
    for (let k = 0; k < n; k++) { const ax = n === 1 ? cx - aw / 2 : x + w * (k === 0 ? .2 : .58); out += `<path d="${arch(ax, top + h * .78, aw, ah)}" fill="var(--dio)" stroke="${ln}" stroke-width="1.1"/>`; }
    out += `<rect x="${x - 6}" y="${top - 6}" width="${w + 12}" height="6" fill="none" stroke="${ln}" stroke-width="1"/>`;
    out += `<text x="${x - 14}" y="${top + h / 2}" text-anchor="end" font-size="13" style="fill:${ln};font-family:var(--disp)">${name}</text><text x="${x - 14}" y="${top + h / 2 + 15}" text-anchor="end" font-size="10" style="fill:${faint}">${Math.round(frac * 100)}%</text>`;
    y = top - 6;
  });
  // 钟楼与风向标
  const bw = 70, bh = 40, bx = cx - bw / 2, by = y - bh;
  out += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="none" stroke="${ln}"/><path d="${arch(cx - 12, by + bh - 4, 24, 26)}" fill="none" stroke="${ln}"/>`;
  out += `<path d="M${bx - 4} ${by} Q${cx} ${by - 46} ${bx + bw + 4} ${by}Z" fill="rgba(245,240,230,.08)" stroke="${ln}"/><line x1="${cx}" y1="${by - 34}" x2="${cx}" y2="${by - 70}" stroke="${ln}" stroke-width="1.4"/><circle cx="${cx}" cy="${by - 52}" r="4" fill="var(--gold)"/><path d="M${cx} ${by - 70} l14 5 l-14 5z" fill="var(--gold)"/>`;
  // 星与地面瓷砖
  const star = (sx, sy, r) => `<g transform="translate(${sx},${sy})"><rect x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" fill="none" stroke="var(--gold)" stroke-width="1"/><rect x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" transform="rotate(45)" fill="none" stroke="var(--gold)" stroke-width="1"/></g>`;
  out += star(60, 70, 10) + star(W - 70, 110, 7) + star(W - 40, 40, 5);
  out += `<line x1="0" y1="${G}" x2="${W}" y2="${G}" stroke="${ln}" stroke-width="1.4"/>`;
  return `<svg class="tower" viewBox="0 0 ${W} ${H}" role="img" aria-label="塔楼：A1 到 B1 的进度"><defs>${defs}</defs>${out}</svg>`;
}

// 听写比对：按字母切词（含西语重音字母）；比对时忽略重音，重音写错单独标出
const WORD_RE = /[\p{L}\p{N}]+(?:['’][\p{L}]+)?/gu;
const foldW = w => w.toLowerCase().replace("’", "'").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function normTokens(s) { return String(s).match(WORD_RE) || []; }
function diffWords(ref, input) {
  const R = String(ref).match(WORD_RE) || [], Rn = R.map(foldW);
  const Uraw = normTokens(input), U = Uraw.map(foldW);
  const dp = Array.from({ length: R.length + 1 }, () => new Array(U.length + 1).fill(0));
  for (let i = R.length - 1; i >= 0; i--) for (let j = U.length - 1; j >= 0; j--) dp[i][j] = Rn[i] === U[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0, acc = 0;
  while (i < R.length || j < U.length) {
    if (i < R.length && j < U.length && Rn[i] === U[j]) {
      const exact = R[i].toLowerCase().replace("’", "'") === Uraw[j].toLowerCase().replace("’", "'");
      if (!exact) acc++;
      out.push([exact ? "ok" : "acc", R[i]]); i++; j++;
    }
    else if (j < U.length && (i >= R.length || dp[i][j + 1] >= dp[i + 1][j])) { out.push(["extra", Uraw[j]]); j++; }
    else { out.push(["miss", R[i]]); i++; }
  }
  return { out, ok: dp[0][0], total: R.length, acc };
}

/* ============ 学习计划引擎 ============ */
const LEVEL_OPTS = { beginner: "基础薄弱", cet4: "四级水平", cet6: "六级水平", advanced: "雅思 6 分以上" };
const TARGET_OPTS = { toeic: "TOEIC 备考", cet4: "通过四级", cet6: "通过六级", ielts: "雅思提分", daily: "日常 & 工作英语" };
const PARTS = [["w", "单词", "var(--c1)"], ["g", "语法", "var(--c2)"], ["r", "阅读", "var(--c3)"], ["l", "听力", "var(--c4)"]];
const round5 = n => Math.max(5, Math.round(n / 5) * 5);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
function rangeAcc(ok, n, days, min) { const N = sumDays(n, days); return N >= min ? sumDays(ok, days) / N : null; }

function generatePlan(p) {
  const base = { toeic: [.28, .14, .28, .30], cet4: [.40, .20, .25, .15], cet6: [.35, .15, .30, .20], ielts: [.30, .10, .30, .30], daily: [.30, .15, .20, .35] }[p.target] || [.35, .15, .25, .25];
  let [w, g, r, l] = base; const notes = []; let factor = 1;
  if (p.level === "beginner") { g += .08; r -= .04; l -= .04; notes.push("基础阶段多给语法一些时间，先把句子结构打牢。"); }
  if (p.level === "advanced") { g -= .05; r += .025; l += .025; }
  if (p.target === "toeic") { const sc = +p.score || 730; factor = { 600: .9, 730: 1, 860: 1.15, 900: 1.25 }[sc] || 1; notes.push(`TOEIC 目标 ${sc} 分：${sc >= 860 ? "核心词表背完后接着背「进阶词汇 & 高频搭配」，Part 7 要练速度。" : sc >= 730 ? "先把核心词表背熟，Part 5 语法题争取每题 20 秒内。" : "以核心词表和 Part 2/3 听力为主，先把基础分拿稳。"}`); }
  const gA = rangeAcc("gOk", "gq", 14, 10), dA = rangeAcc("dOk", "dw", 14, 30), vA = rangeAcc("rvOk", "rv", 14, 20), rA = rangeAcc("rqOk", "rq", 14, 6);
  if (gA != null && gA < .65) { g += .05; w -= .05; notes.push(`近两周语法正确率 ${Math.round(gA * 100)}%，语法时间上调，并优先安排薄弱主题。`); }
  if (dA != null && dA < .65) { l += .05; r -= .05; notes.push(`近两周听写准确率 ${Math.round(dA * 100)}%，听力时间上调，建议多用精听。`); }
  const lqA = rangeAcc("lqOk", "lq", 14, 9); if (lqA != null && lqA < .65 && !(dA != null && dA < .65)) { l += .05; r -= .05; notes.push(`近两周听力理解正确率 ${Math.round(lqA * 100)}%，听力时间上调。`); }
  if (rA != null && rA < .65) { r += .05; w -= .03; l -= .02; notes.push(`近两周阅读理解正确率 ${Math.round(rA * 100)}%，阅读篇数上调。`); }
  notes.push("每天的新词数会按复习积压和正确率自动上下浮动，以单词页显示的为准。");
  const sum = w + g + r + l; [w, g, r, l] = [w, g, r, l].map(x => Math.max(.05, x) / sum);
  const M = p.minutes;
  const mins = { w: Math.round(M * w), g: Math.round(M * g), r: Math.round(M * r), l: Math.round(M * l) };
  let newWords = clamp(round5(mins.w / 1.2 * factor), 5, 60);
  const grammarQ = clamp(Math.round(mins.g / 1.5), 3, 20);
  const listen = Math.max(5, Math.round(mins.l / 5) * 5);
  const rpd = mins.r / 12;
  const upto = { b1: ["b1"], b2: ["b1", "b2"], all: BOOK_ORDER }[p.deck] || BOOK_ORDER;
  const left = upto.reduce((n, b) => n + bookWords(b).length - bookStats(b).learned, 0);
  const goalName = { b1: "第 1 册", b2: "第 1–2 册", all: "全部三册" }[p.deck] || "全部三册";
  if (p.examDate) {
    const days = Math.round((parseKey(p.examDate) - parseKey(today())) / 864e5);
    if (days > 0 && left > 0) {
      const studyDays = Math.max(1, Math.floor(days * p.days / 7 * .85)); // 留 15% 给考前总复习
      const need = Math.ceil(left / studyDays);
      if (need > newWords) { const nw = Math.min(round5(need), 80); notes.push(`距考试 ${days} 天，${goalName}还剩 ${left} 词未学，每天至少 ${need} 个新词才能学完，已上调到 ${nw}。${need > 80 ? "按现在的时间投入很难背完，建议增加每日学习时间或把目标改成少一点的词书。" : ""}`); newWords = nw; }
      else notes.push(`距考试 ${days} 天，按每天 ${newWords} 个新词，约 ${Math.ceil(left / newWords)} 个学习日可学完${goalName}。`);
    } else if (days <= 0) notes.push("考试日期已过，可以更新日期。");
  } else if (left > 0) notes.push(`按每天 ${newWords} 个新词，约 ${Math.ceil(left / newWords)} 个学习日可学完${goalName}（还剩 ${left} 词）。`);
  const lmodes = p.target === "toeic" ? ["答题", "精听", "听写"] : ["精听", "听写", "泛听"];
  const days = []; let si = 0;
  for (let d = 0; d < 7; d++) {
    if (d >= p.days) { days.push({ rest: true, listen: Math.round(listen / 2 / 5) * 5 || 5, lmode: "泛听" }); continue; }
    const reading = rpd >= 1 ? Math.round(rpd) : (si % Math.max(1, Math.round(1 / Math.max(rpd, .2))) === 0 ? 1 : 0);
    days.push({ rest: false, newWords, grammarQ, reading, listen, lmode: lmodes[si % 3] });
    si++;
  }
  return { createdAt: today(), inputs: { ...p }, mins, newWords, grammarQ, listen, days, notes };
}

  return pl.days[dowMon(k)];
}

function computeWeak() {
  const out = [];
  allTopics().forEach(t => { const s = S.stats.grammar[t.id]; if (s && s.n >= 4 && s.ok / s.n < .7) out.push({ lv: s.ok / s.n < .5 ? "bad" : "warn", text: `语法「${t.name}」正确率 ${Math.round(s.ok / s.n * 100)}%，建议重看讲解再做错题重练`, go: () => openLesson(t.id) }); });
  const due = totalDue(); if (due > 40) out.push({ lv: "warn", text: `有 ${due} 个单词积压待复习，先清复习再学新词`, go: () => { WS.mode = "overview"; go("words"); } });
  const vA = rangeAcc("rvOk", "rv", 7, 15); if (vA != null && vA < .75) out.push({ lv: "warn", text: `近 7 天单词复习正确率 ${Math.round(vA * 100)}%，新词量会自动减少`, go: () => go("plan") });
  const lA = rangeAcc("lqOk", "lq", 7, 6); if (lA != null && lA < .7) out.push({ lv: "warn", text: `近 7 天听力理解正确率 ${Math.round(lA * 100)}%，做完题后用精听把没听懂的句子逐句过一遍`, go: () => go("listening") });
  const mk = (S.stats.mock || [])[0]; if (mk && mk.sec / mk.n > 25) out.push({ lv: "", text: `上次 Part 5 模拟平均 ${Math.round(mk.sec / mk.n)} 秒/题，正式考试建议 20 秒内`, go: () => { GS.tab = "topics"; go("grammar"); } });
  const dA = rangeAcc("dOk", "dw", 7, 20); if (dA != null && dA < .7) out.push({ lv: "warn", text: `近 7 天听写准确率 ${Math.round(dA * 100)}%，多用精听逐句跟读`, go: () => { LS.mode = "intensive"; go("listening"); } });

/* ---- 塔：每 100 个词一层，三册自下而上 ---- */
const brickState = r => !r ? 0 : r[0] >= 6 ? 3 : r[0] >= 3 ? 2 : 1; // 0 待砌 · 1 泥坯 · 2 晒干 · 3 烧透
function towerState() {
  const floors = []; let fired = 0, dried = 0, mud = 0, total = 0;
  for (const b of BOOK_ORDER) {
    const ws = bookWords(b);
    for (let i = 0; i < ws.length; i += 100) {
      const f = { b, n: 0, s: [0, 0, 0, 0] };
      for (const w of ws.slice(i, i + 100)) { const st = brickState(prog(w)); f.s[st]++; f.n++; }
      fired += f.s[3]; dried += f.s[2]; mud += f.s[1]; total += f.n; floors.push(f);
    }
  }
  // 一层里九成的砖砌上就算建成
  let built = 0; for (const f of floors) { if ((f.n - f.s[0]) / f.n >= .9) built++; else break; }
  return { floors, fired, dried, mud, total, built };
}
function towerNight() { const hr = new Date().getHours(); return isDark() || hr < 5 || hr >= 20; }
function isDark() { const t = document.documentElement.dataset.theme; return t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); }
function towerSVG(tw) {
  // 石碑上的白线立面：三段退台，已砌部分按砖的状态用不同密度的斜线表示
  const W = 520, H = 470, G = H - 34, n = tw.floors.length;
  const tiers = BOOK_ORDER.map(b => tw.floors.filter(f => f.b === b).length);
  const fh = (G - 64) / (n + 3);
  const ln = "rgba(233,229,219,.85)", faint = "rgba(233,229,219,.26)", txt = "rgba(233,229,219,.62)", sig = "var(--sig)";
  const cx = W / 2 + 26;
  const pat = (id, gap, op) => `<pattern id="${id}" width="${gap}" height="${gap}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v${gap}" stroke="rgba(233,229,219,${op})" stroke-width="1.3"/></pattern>`;
  let y = G, i = 0, body = "", ann = "";
  const cur = tw.floors.findIndex(f => f.s[0] > 0);
  tiers.forEach((t, ti) => {
    const w0 = [W * .7, W * .5, W * .3][ti], w1 = [W * .56, W * .35, W * .2][ti];
    const tierStart = y;
    for (let k = 0; k < t; k++, i++) {
      const f = tw.floors[i]; const w = w0 - (w0 - w1) * k / Math.max(1, t - 1), yy = y - fh, x = cx - w / 2;
      const filled = f.n - f.s[0];
      body += `<g class="fl" data-floor="${i}" tabindex="0" role="button" aria-label="第 ${i + 1} 层"><rect class="hit" x="${(x - 4).toFixed(1)}" y="${yy.toFixed(1)}" width="${(w + 8).toFixed(1)}" height="${fh.toFixed(1)}" fill="transparent"/>`;
      body += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${fh.toFixed(1)}" fill="none" stroke="${filled ? ln : faint}" stroke-width="${filled ? .9 : .6}" ${filled ? "" : 'stroke-dasharray="2 3"'}/>`;
      let xx = x;
      for (const [c, id] of [[f.s[3], "hF"], [f.s[2], "hD"], [f.s[1], "hM"]]) { if (!c) continue; const sw = w * c / f.n; body += `<rect x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="${sw.toFixed(1)}" height="${fh.toFixed(1)}" fill="url(#${id})"/>`; xx += sw; }
      body += `</g>`;
      if (i === cur) {
        body += `<rect x="${xx.toFixed(1)}" y="${(yy + fh - 2).toFixed(1)}" width="${Math.max(3, w * .04).toFixed(1)}" height="2" style="fill:${sig}"/>`;
        ann += `<line x1="${(x + w + 4).toFixed(1)}" y1="${(yy + fh / 2).toFixed(1)}" x2="${W - 8}" y2="${(yy - 20).toFixed(1)}" style="stroke:${sig}" stroke-width=".9"/><text x="${W - 8}" y="${(yy - 25).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--on-dio);font-family:var(--ui)">第 ${i + 1} 层 施工中</text>`;
      }
      if (k === 0) ann += `<line x1="${(x - 6).toFixed(1)}" y1="${y.toFixed(1)}" x2="4" y2="${y.toFixed(1)}" stroke="${faint}" stroke-width=".6"/><text x="4" y="${(y - 4).toFixed(1)}" font-size="10" letter-spacing="1" style="fill:${txt};font-family:var(--disp-sc)">▽ +${String(i).padStart(2, "0")} ${BOOKS[BOOK_ORDER[ti]].tier} · ${BOOKS[BOOK_ORDER[ti]].short}</text>`;
      y = yy;
    }
    y -= fh * .9;
  });
  const top = y + fh * .9;
  const dx = W - 16;
  ann += `<g stroke="${ln}" stroke-width=".8"><line x1="${dx}" y1="${top}" x2="${dx}" y2="${G}"/><line x1="${dx - 5}" y1="${top}" x2="${dx + 5}" y2="${top}"/><line x1="${dx - 5}" y1="${G}" x2="${dx + 5}" y2="${G}"/></g><text transform="translate(${dx - 7},${((top + G) / 2).toFixed(1)}) rotate(-90)" text-anchor="middle" font-size="10" letter-spacing="1" style="fill:${txt};font-family:var(--ui)">${n} 层 · ${tw.total} 词</text>`;
  ann += `<line x1="0" y1="${G}" x2="${W}" y2="${G}" stroke="${ln}" stroke-width="1.4"/><line x1="${cx}" y1="${top - 6}" x2="${cx}" y2="${top - 38}" stroke="${faint}" stroke-dasharray="3 3"/><text x="${cx}" y="${top - 44}" text-anchor="middle" font-size="10" letter-spacing="3" style="fill:${txt};font-family:var(--disp-sc)">AD CAELUM · 通天</text>`;
  return `<svg class="tower" viewBox="0 0 ${W} ${H}" role="img" aria-label="你的塔：已建成 ${tw.built} 层，共 ${n} 层"><defs>${pat("hF", 3, .9)}${pat("hD", 5, .6)}${pat("hM", 8, .45)}</defs>${body}${ann}</svg>`;
}

function scoreTrendHTML() {
  const ts = (S.stats.tests || []).slice(0, 12).reverse();
  if (!ts.length) return "";
  const W = 560, H = 160, P = 30; const lo = 10, hi = 990;
  const x = i => ts.length === 1 ? W / 2 : P + i * (W - 2 * P) / (ts.length - 1);
  const y = v => H - 20 - (v - lo) / (hi - lo) * (H - 40);
  const pts = ts.map((t, i) => `${x(i)},${y(t.est)}`).join(" ");
  return `<div class="card stack"><div class="sec-head"><h2>预估分数趋势</h2><span class="muted" style="font-size:13px">±50</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="预估分数趋势">
      ${[200, 400, 600, 800].map(v => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="4" y="${y(v) + 4}" class="lab">${v}</text>`).join("")}
      <polyline points="${pts}" class="line"/>
      ${ts.map((t, i) => `<circle cx="${x(i)}" cy="${y(t.est)}" r="4" class="dot" data-tip="${t.date} · 预估 ${t.est}（听力 ${t.L} · 阅读 ${t.R}）· 词汇量≈${t.vocab}"/><text x="${x(i)}" y="${y(t.est) - 9}" text-anchor="middle" class="val">${t.est}</text><text x="${x(i)}" y="${H - 4}" text-anchor="middle" class="lab">${t.date.slice(5).replace("-", "/")}</text>`).join("")}
    </svg></div>`;
}

/* ---- 题目生成 ---- */
function vocabItem(w, type, withUnknown) {
  const it = { kind: "vocab", w, k: "quiz", type }; prepQuiz(it);
  if (withUnknown) it.opts = it.opts.concat(["不认识"]);
  return it;
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }
function startPlacement() {
  const b1 = LEX.books.b1, b2 = LEX.books.b2, b3 = LEX.books.b3;
  const bands = [["b1a", b1.slice(0, 800), 4], ["b1b", b1.slice(800), 4], ["b2a", b2.slice(0, 884), 4], ["b2b", b2.slice(884), 4], ["b3", b3, 4]];
  const items = [];
  for (const [band, ws, n] of bands) for (const w of sample(ws, n)) items.push({ ...vocabItem(w, "en2zh", true), band, sec: "词汇" });
  const pick = (ids, n, band) => shuffle(ids.flatMap(id => (topicById(id)?.q || []).map(q => ({ q, tid: id })))).slice(0, n).map(x => ({ kind: "gram", ...x, band, sec: "语法" }));
  items.push(...pick(STAGES[0].ids(), 6, "g1"), ...pick(STAGES[1].ids(), 5, "g2"), ...pick(STAGES[2].ids(), 5, "g3"));
  const canListen = TTS.ok || PART2.some(s => s.items.some(i => AudioBank.has(i.qv, i.q)));
  if (canListen) items.push(...sample(PART2.flatMap(s => s.items), 6).map(it => ({ kind: "listen", it, band: "l", sec: "听力" })));
  TS.run = { kind: "placement", title: "入门测试", items, i: 0, ans: [], canListen, t0: Date.now() };
  // 扩展词频段的词需要异步取释义，取到就插进词汇部分
  loadJSON(LANG().ext, "ext").then(async ext => {
    const extra = [...sample(ext.slice(0, 3000), 3).map(w => [w, "e1"]), ...sample(ext.slice(3000, 9000), 3).map(w => [w, "e2"])];
    const ds = await Promise.all(extra.map(([w]) => dictEntry(w)));
    const R = TS.run; if (!R || R.kind !== "placement") return;
    const pool = LEX.books.b1.slice(0, 1600);
    extra.forEach(([w, band], j) => {
      const d = ds[j]; if (!d) return;
      const right = sensesFromDict(d[1])[0]; if (!right) return;
      const rt = (right[0] ? right[0] + " " : "") + right[1].split("；").slice(0, 2).join("；");
      const opts = shuffle([rt, ...sample(pool, 3).map(x => firstSense(wordInfo(x)))]).concat(["不认识"]);
      const at = R.items.findIndex((x, k) => k > R.i && x.kind !== "vocab");
      R.items.splice(at < 0 ? R.items.length : at, 0, { kind: "vocab", w, type: "en2zh", opts, right: rt, band, sec: "词汇", ext: d });
    });
    if (current === "test") render();
  }).catch(() => { });
  go("test");
}
function startWeekly() {
  const from = weekKey(); const recentBad = [...allProg()].filter(([, r]) => r[3] > 0 && r[4] >= addDays(today(), -14)).map(([k]) => wordInfo(k)?.w).filter(Boolean);
  const favW = Object.keys(S.favs.w || {}).filter(w => wordInfo(w));
  let ws = [...new Set([...sample(weekNewWords(), 8), ...sample(recentBad, 4), ...sample(favW, 3)])];
  if (ws.length < 15) { const learned = [...allProg()].map(([k]) => wordInfo(k)?.w).filter(Boolean); ws = [...new Set([...ws, ...sample(learned, 15 - ws.length)])]; }
  if (ws.length < 15) ws = [...new Set([...ws, ...nextNewWords(activeBook(), 15 - ws.length)])];
  const types = ["en2zh", "zh2en", "cloze", "audio", "zh2en"];
  const items = ws.slice(0, 15).map((w, i) => ({ ...vocabItem(w, types[i % types.length]), sec: "词汇" }));
  const gq = [];
  S.mistakes.items.slice(0, 4).forEach(m => gq.push({ kind: "gram", q: { q: m.q, o: m.o, a: m.a, e: m.e }, tid: m.topic }));
  Object.values(S.favs.q || {}).slice(0, 2).forEach(q => gq.push({ kind: "gram", q, tid: q.topic }));
  const readIds = Object.entries(S.stats.gread || {}).filter(([, d]) => d >= from).map(([id]) => id);
  const pool = (readIds.length ? readIds : [nextLesson().id]).flatMap(id => (topicById(id)?.q || []).map(q => ({ kind: "gram", q, tid: id })));
  const seen = new Set(gq.map(x => x.q.q));
  for (const x of shuffle(pool)) { if (gq.length >= 10) break; if (!seen.has(x.q.q)) { seen.add(x.q.q); gq.push(x); } }
  for (const x of shuffle(STAGES[2].ids().flatMap(id => topicById(id).q.map(q => ({ kind: "gram", q, tid: id }))))) { if (gq.length >= 10) break; if (!seen.has(x.q.q)) { seen.add(x.q.q); gq.push(x); } }
  items.push(...gq.map(x => ({ ...x, sec: "语法" })));
  TS.run = { kind: "weekly", title: "本周测验", items, i: 0, ans: [], t0: Date.now() };
  go("test");
}

    opts = it.opts;

    else if (it.type === "cloze") body = `<div class="eyebrow">选词填空（选项为原形）</div><div class="ex en" style="font-size:19px">${esc(it.cz.en)}<span class="zh">${esc(it.cz.zh)}</span></div>`;
    else if (it.type === "spell") { it.type = "zh2en"; prepQuiz(Object.assign(it, { opts: null })); return renderRun(el); }
    if (!it.spoken && (it.type === "audio")) { it.spoken = true; Speech.say(it.w); }

  }
  el.innerHTML = `<div class="flash stack">${head}<div class="entry">${body}
    <div class="opts ${it.kind === "listen" ? "abc" : ""}">${opts.map((o, i) => `<button class="opt ${it.kind !== "vocab" || it.type === "zh2en" || it.type === "cloze" ? "en" : ""} ${o === "不认识" ? "unk" : ""}" data-o="${i}"><span class="faint num">${i + 1}</span>　${esc(o)}</button>`).join("")}</div>
    <div style="flex:1"></div><div class="meta"><span>${esc(R.title)} · ${esc(it.sec)}</span><span>选完自动下一题</span></div></div></div>`;
  $("#quit").onclick = () => confirmBox("退出测试？本次作答不会保存。", "退出", () => { TS.run = null; render(); });
  $("#replay") && ($("#replay").onclick = () => Speech.say(it.w));
  const lp = $("#lplay");
  if (lp) {
    const play = () => { const seq = [[it.it.qv, it.it.q], ...it.it.o.map((o, k) => [it.it.ov, `${"ABC"[k]}. ${o}`])]; let k = 0; const nx = () => { if (k < seq.length && TS.run === R && R.items[R.i] === it) { const [v, t] = seq[k++]; Speech.say(t, { voice: v, onend: () => setTimeout(nx, 500) }); } }; nx(); };
    lp.onclick = () => { if ((it.plays || 0) >= 2) return toast("已经听过两遍了"); it.plays = (it.plays || 0) + 1; play(); };
    if (!it.plays) { it.plays = 1; setTimeout(play, 300); }
  }

function itemOK(it, a) {
  if (a == null) return false;

  if (it.kind === "gram") return a === it.q.a;
  return a === it.it.a;
}
function renderRunEnd(el) {

    R.graded = true;
    R.ok = R.items.filter((it, k) => itemOK(it, R.ans[k])).length;

  }
  const wrong = R.items.map((it, k) => ({ it, a: R.ans[k] })).filter(x => !itemOK(x.it, x.a));

  el.innerHTML = `<div class="stack" style="max-width:780px;margin:0 auto">

function finishPlacement(R) {
  const by = {}; R.items.forEach((it, k) => { const b = it.band; by[b] ||= { ok: 0, n: 0, wrong: 0 }; by[b].n++; if (itemOK(it, R.ans[k])) by[b].ok++; else if (it.kind === "vocab" ? it.opts[R.ans[k]] !== "不认识" : true) by[b].wrong++; });
  const vacc = b => { const x = by[b]; if (!x?.n) return null; return Math.max(0, (x.ok - x.wrong / 3) / x.n); };
  const sizes = { b1a: 800, b1b: 800, b2a: 884, b2b: 884, b3: 568, e1: 3000, e2: 6000 };
  let vocab = 0; let last = 1;
  for (const b of ["b1a", "b1b", "b2a", "b2b", "b3", "e1", "e2"]) { const a = vacc(b); const use = a == null ? last * .7 : a; vocab += use * sizes[b]; last = use; }
  vocab = Math.round(vocab / 50) * 50;
  const g = ["g1", "g2", "g3"].map(b => by[b] ? guessAdj(by[b].ok, by[b].n, 4) : 0);
  const gAdj = g[0] * .3 + g[1] * .3 + g[2] * .4;
  const v = Math.min(1, vocab / 6500);
  const lAdj = by.l ? guessAdj(by.l.ok, by.l.n, 3) : null;
  const Rsc = clamp(Math.round((5 + 490 * (.5 * v + .5 * gAdj)) / 5) * 5, 5, 495);
  const Lsc = clamp(Math.round((5 + 490 * (lAdj == null ? .5 * v + .5 * gAdj : .4 * v + .6 * lAdj)) / 5) * 5, 5, 495);
  const est = Lsc + Rsc;
  const book = vocab < 1800 ? "b1" : vocab < 3200 ? "b2" : "b3";
  const lesson = g[0] < .75 ? GRAMMAR_BASICS[0].id : g[1] < .7 ? STAGES[1].ids()[0] : STAGES[2].ids()[0];
  const level = vocab < 2000 ? "beginner" : vocab < 3500 ? "cet4" : vocab < 5000 ? "cet6" : "advanced";
  const advice = [
    `词汇量约 ${vocab}：${book === "b1" ? "建议从第 1 册开始，认识的词直接点“太简单”跳过。" : book === "b2" ? "第 1 册基本掌握，建议从第 2 册开始；第 1 册可以用题目复习抽查。" : "基础词汇不错，建议直接背第 3 册 TOEIC 商务词。"}`,
    `语法：零基础部分 ${Math.round(g[0] * 100)}%，进阶 ${Math.round(g[1] * 100)}%，TOEIC 专项 ${Math.round(g[2] * 100)}%（已扣除猜对的概率）。建议从「${topicById(lesson).name}」学起。`,
    lAdj == null ? "当前环境不能播放声音，没有测听力，听力分按词汇和语法估算。" : `听力 Part 2 正确率 ${Math.round(by.l.ok / by.l.n * 100)}%${lAdj < .5 ? "，建议每天做 Part 2 答题和精听。" : "。"}`
  ];
  R.result = { est, L: Lsc, R: Rsc, vocab, book, lesson, level, advice, parts: [["词汇", (by.b1a && vacc("b1a") || 0) * .5 + (vacc("b2a") || 0) * .5], ["语法", gAdj], ...(lAdj == null ? [] : [["听力", lAdj]])] };
  S.stats.tests = [{ date: today(), est, L: Lsc, R: Rsc, vocab, g, l: lAdj }, ...(S.stats.tests || [])].slice(0, 30); saveStats();
}
function finishWeekly(R) {
  let vOk = 0, vN = 0, gOk = 0, gN = 0;
  R.items.forEach((it, k) => {
    const ok = itemOK(it, R.ans[k]);
    if (it.kind === "vocab") { vN++; if (ok) vOk++; else { const r = prog(it.w); if (r) { r[1] = addDays(today(), 1); r[3]++; setProg(it.w, r); } } }
    else if (it.kind === "gram") { gN++; if (ok) gOk++; gradeGrammar(it.tid, it.q, R.ans[k] ?? -1); }
  });
  S.stats.weekly ||= {}; S.stats.weekly[weekKey()] = { date: today(), ok: vOk + gOk, n: vN + gN, v: [vOk, vN], g: [gOk, gN] }; saveStats();
}

// 版画立面：五重塔。每一重一百语，三册自下而上；背景有日轮与富士，塔基是青海波
function towerSVGJa(tw) {
  const W = 520, H = 500, G = H - 44, n = tw.floors.length;
  const ln = "rgba(243,234,214,.9)", faint = "rgba(243,234,214,.28)", txt = "rgba(243,234,214,.66)";
  const cx = W / 2 + 34, top = 70, fh = (G - top) / (n + 1.2);
  const pat = (id, gap, op) => `<pattern id="${id}" width="${gap}" height="${gap}" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><path d="M0 0v${gap}" stroke="rgba(243,234,214,${op})" stroke-width="1.3"/></pattern>`;
  const cur = tw.floors.findIndex(f => f.s[0] > 0);
  let body = "", ann = "";
  const w0 = W * .36, w1 = W * .2;
  tw.floors.forEach((f, i) => {
    const y = G - (i + 1) * fh, w = w0 - (w0 - w1) * i / Math.max(1, n - 1), x = cx - w / 2;
    const rh = fh * .42, ov = fh * .95, filled = f.n - f.s[0];
    const roof = `M${(x - ov).toFixed(1)} ${(y + rh).toFixed(1)} Q${(x - ov * .2).toFixed(1)} ${(y + rh * .55).toFixed(1)} ${(x + w * .12).toFixed(1)} ${y.toFixed(1)} L${(x + w * .88).toFixed(1)} ${y.toFixed(1)} Q${(x + w + ov * .2).toFixed(1)} ${(y + rh * .55).toFixed(1)} ${(x + w + ov).toFixed(1)} ${(y + rh).toFixed(1)} Z`;
    body += `<g class="fl" data-floor="${i}" tabindex="0" role="button" aria-label="第 ${i + 1} 重"><rect class="hit" x="${(x - ov).toFixed(1)}" y="${y.toFixed(1)}" width="${(w + 2 * ov).toFixed(1)}" height="${fh.toFixed(1)}" fill="transparent"/>`;
    body += `<rect x="${x.toFixed(1)}" y="${(y + rh).toFixed(1)}" width="${w.toFixed(1)}" height="${(fh - rh).toFixed(1)}" fill="none" stroke="${filled ? ln : faint}" stroke-width=".8" ${filled ? "" : 'stroke-dasharray="2 3"'}/>`;
    let xx = x;
    for (const [c, id] of [[f.s[3], "jF"], [f.s[2], "jD"], [f.s[1], "jM"]]) { if (!c) continue; const sw = w * c / f.n; body += `<rect x="${xx.toFixed(1)}" y="${(y + rh).toFixed(1)}" width="${sw.toFixed(1)}" height="${(fh - rh).toFixed(1)}" fill="url(#${id})"/>`; xx += sw; }
    body += `<path d="${roof}" fill="${filled ? "rgba(243,234,214,.16)" : "none"}" stroke="${filled ? ln : faint}" stroke-width="${filled ? 1 : .6}"/></g>`;
    if (i === cur) ann += `<line x1="${(x + w + ov + 4).toFixed(1)}" y1="${(y + fh / 2).toFixed(1)}" x2="${W - 8}" y2="${(y - 14).toFixed(1)}" style="stroke:var(--sig)" stroke-width=".9"/><text x="${W - 8}" y="${(y - 19).toFixed(1)}" text-anchor="end" font-size="12" style="fill:var(--on-dio);font-family:var(--disp)">第${KNUM(i + 1)}重 施工中</text>`;
    if (i === 0 || f.b !== tw.floors[i - 1].b) ann += `<line x1="${(x - ov - 6).toFixed(1)}" y1="${(y + fh).toFixed(1)}" x2="4" y2="${(y + fh).toFixed(1)}" stroke="${faint}" stroke-width=".6"/><text x="4" y="${(y + fh - 5).toFixed(1)}" font-size="11" letter-spacing="1" style="fill:${txt};font-family:var(--disp)">${esc(BOOKS[f.b].name)}</text>`;
  });
  const ty = G - n * fh;
  const spire = `<line x1="${cx}" y1="${ty}" x2="${cx}" y2="${ty - 52}" stroke="${ln}" stroke-width="1.4"/>${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => `<line x1="${cx - 7 + k * .4}" x2="${cx + 7 - k * .4}" y1="${ty - 8 - k * 4.4}" y2="${ty - 8 - k * 4.4}" stroke="${ln}" stroke-width="1"/>`).join("")}<circle cx="${cx}" cy="${ty - 56}" r="3" fill="${ln}"/>`;
  const fuji = `<path d="M-10 ${G} L96 ${G - 150} Q108 ${G - 160} 120 ${G - 150} L240 ${G}" fill="rgba(243,234,214,.06)" stroke="${faint}" stroke-width=".8"/><path d="M78 ${G - 128} L96 ${G - 150} Q108 ${G - 160} 120 ${G - 150} L138 ${G - 128} Q124 ${G - 120} 116 ${G - 130} Q106 ${G - 118} 96 ${G - 131} Q88 ${G - 120} 78 ${G - 128}Z" fill="rgba(243,234,214,.5)"/>`;
  const sun = `<circle cx="92" cy="92" r="34" style="fill:var(--sig)"/>`;
  const clouds = "";
  const waves = [...Array(Math.ceil(W / 28) + 1)].map((_, i) => [0, 1].map(r => `<g transform="translate(${i * 28 + (r ? 14 : 0)},${G + 10 + r * 9})">${[13, 9, 5].map(rr => `<path d="M${-rr} 0 A${rr} ${rr} 0 0 1 ${rr} 0" fill="var(--dio)" stroke="${ln}" stroke-width=".8"/>`).join("")}</g>`).join("")).join("");
  return `<svg class="tower" viewBox="0 0 ${W} ${H}" role="img" aria-label="五重塔：已建成 ${tw.built} 重，共 ${n} 重"><defs>${pat("jF", 3, .9)}${pat("jD", 5, .6)}${pat("jM", 8, .45)}</defs>${sun}${clouds}${fuji}${spire}${body}<line x1="0" y1="${G}" x2="${W}" y2="${G}" stroke="${ln}" stroke-width="1.4"/>${waves}${ann}</svg>`;
}

/* ============ 内容抽查：协作产出（内容包）的人工质检 ============

   结果写进存档 audit/<日期_序号>，指挥 Claude 读取后据此返工。 */
async function auditPool() {
  const lang = curLang(), voice = curVoice(), pool = [];
  for (const p of Packs.list(lang, "examples")) {
    const j = await Packs.json(p); if (!j) continue;
    for (const [w, xs] of Object.entries(j)) for (const [s, zh] of xs) pool.push({ t: "example", w, s, zh });
  }
  // 词条本身的录音也抽一些
  const hasAudio = Packs.list(lang, "audio").length > 0;
  if (hasAudio) for (const b of BOOK_ORDER) for (const w of (LEX.books[b] || [])) if (AudioBank.has(voice, w)) pool.push({ t: "word", w, s: w, zh: firstSense(wordInfo(w)) });
  return { pool, hasAudio, voice };
}
function auditSay(text) { if (isEs()) sayEs(text); else Speech.say(text); }
async function auditCard(el) {
  if (!Packs.list(curLang(), "examples").length && !Packs.list(curLang(), "audio").length) return;
  let done = [];
  try { done = await Store.list("audit"); } catch { }
  const mine = done.filter(d => d.lang === curLang());
  const n = mine.reduce((a, d) => a + (d.items?.length || 0), 0), bad = mine.reduce((a, d) => a + (d.items || []).filter(x => x.v !== "ok").length, 0);
  const card = document.createElement("div");
  card.className = "card stack";
  card.innerHTML = `<div class="sec-head"><h3>内容抽查</h3><span class="muted num" style="font-size:13px">${n ? `已抽查 ${n} 条 · 标记问题 ${bad} 条` : "还没有抽查过"}</span></div>
    <p class="muted" style="margin:0;font-size:14px">例句和录音由协作 AI 制作、Claude 审过。每次抽 10 条，结果会存进学习存档，Claude 据此返工。</p>
    <div><button class="btn pri" id="au-go">抽查 10 条</button></div>`;
  el.appendChild(card);
  $("#au-go", card).onclick = () => auditRun();
}
async function auditRun() {
  const { pool, hasAudio } = await auditPool();
  if (!pool.length) { toast("还没有可抽查的内容"); return; }
  const pick = [...pool].sort(() => Math.random() - .5).slice(0, 10);
  const res = []; let i = 0;
  modal(`<div class="stack" id="au-box"></div>`, (m, close) => {
    const box = $("#au-box", m);
    const show = () => {
      if (i >= pick.length) return finish();
      const it = pick[i];
      box.innerHTML = `<div class="row" style="justify-content:space-between"><span class="eyebrow">抽查 ${i + 1} / ${pick.length} · ${it.t === "word" ? "单词录音" : "例句"}</span><button class="btn sm" data-close>退出</button></div>
        <div class="stack" style="gap:6px"><div style="font-size:20px;line-height:1.5">${esc(it.s)} ${hasAudio ? `<button class="spk sm" id="au-play" aria-label="播放">${ICON.spk}</button>` : ""}</div>
        <div class="muted">${esc(it.zh || "")}${it.t === "example" ? ` · <b>${esc(it.w)}</b>` : ""}</div></div>
        <textarea id="au-note" rows="2" placeholder="哪里不对？（可不填）"></textarea>
        <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn pri" data-v="ok">没问题</button>${it.t === "example" ? `<button class="btn" data-v="text">句子/翻译不对</button>` : ""}${hasAudio ? `<button class="btn" data-v="audio">读音不对</button>` : ""}</div>`;
      $("[data-close]", box).addEventListener("click", () => { if (res.length) finish(); });
      if (hasAudio) { $("#au-play", box).onclick = () => auditSay(it.s); auditSay(it.s); }
      $$("[data-v]", box).forEach(b => b.onclick = () => {
        res.push({ t: it.t, w: it.w, s: it.s, v: b.dataset.v, note: $("#au-note", box).value.trim() });
        i++; show();
      });
    };
    const finish = async () => {
      const bad = res.filter(r => r.v !== "ok").length;
      box.innerHTML = `<h3>抽查完成</h3><p class="muted">${res.length} 条里标记了 ${bad} 条问题。${bad ? "Claude 下次会读取并返工。" : ""}</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-close>好</button></div>`;
      if (!res.length) return;
      try { await Store.set(`audit/${today()}_${String(Date.now()).slice(-6)}`, { lang: curLang(), at: new Date().toISOString(), voice: curVoice(), items: res }); }
      catch { toast("抽查结果保存失败"); }
    };
    show();
  });
}

/* ============ 图纸：粗粝笔触、纸张滤镜、砖块进度 ============
   三张图纸（EN 羊皮纸炭笔 / JA 和纸水墨 / ES 阿马特树皮纸）共用这里的笔、滤镜和进度模型。
   画面用带种子的随机数生成：同一份进度每次画出来都一样。 */
const SK = (() => {
  const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const f = n => (Math.round(n * 10) / 10).toString();
  let clipN = 0;
  class Pen {
    constructor(seed, prefix = "k") { this.r = rng(seed); this.o = []; this.defs = []; this.pre = prefix + (++clipN) + "_"; this.n = 0; }
    rand(a, b) { return a + (b - a) * this.r(); }
    j(a) { return (this.r() * 2 - 1) * a; }
    raw(s) { this.o.push(s); return this; }
    // 一笔 = 2~3 条带抖动的二次曲线
    line(x1, y1, x2, y2, { c = "#2b2219", w = [1.2, 2.4], o = [.55, .85], n = 2, jit = 1.1, cap = "round" } = {}) {
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      for (let i = 0; i < n; i++) {
        const a = [x1 + this.j(jit), y1 + this.j(jit)], b = [x2 + this.j(jit), y2 + this.j(jit)];
        const bow = this.j(Math.min(2.5, L * .012 + .6));
        const cx = (a[0] + b[0]) / 2 + nx * bow, cy = (a[1] + b[1]) / 2 + ny * bow;
        this.o.push(`<path d="M${f(a[0])} ${f(a[1])} Q${f(cx)} ${f(cy)} ${f(b[0])} ${f(b[1])}" stroke="${c}" stroke-width="${f(this.rand(w[0], w[1]) * 100 / 100)}" opacity="${this.rand(o[0], o[1]).toFixed(2)}" fill="none" stroke-linecap="${cap}"/>`);
      }
      return this;
    }
    poly(pts, opts, closed = true) { for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; this.line(a[0], a[1], b[0], b[1], opts); } return this; }
    clip(inner) { const id = this.pre + (++this.n); this.defs.push(`<clipPath id="${id}">${inner}</clipPath>`); return id; }
    // 在多边形内画平行排线
    hatch(pts, { ang = 70, gap = 2.6, c = "#2b2219", w = [.5, 1.1], o = [.25, .45], cross = 0, clipD } = {}) {
      const id = this.clip(clipD ? `<path d="${clipD}"/>` : `<polygon points="${pts.map(p => f(p[0]) + "," + f(p[1])).join(" ")}"/>`);
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 4;
      const out = [];
      const pass = a => {
        const t = a * Math.PI / 180, ux = Math.cos(t), uy = Math.sin(t), vx = -uy, vy = ux;
        for (let s = -R; s <= R; s += gap * this.rand(.75, 1.25)) {
          const px = cx + vx * s, py = cy + vy * s;
          out.push(`<line x1="${f(px - ux * R)}" y1="${f(py - uy * R)}" x2="${f(px + ux * R)}" y2="${f(py + uy * R)}" stroke="${c}" stroke-width="${this.rand(w[0], w[1]).toFixed(2)}" opacity="${this.rand(o[0], o[1]).toFixed(2)}"/>`);
        }
      };

/* ---- 砖块即进度：每一点学习都折算成泥，100 点砌满一块 ---- */
const BRICK_PTS = 100;
const BRICK_W = { nw: 3, rv: 1, gq: 1, rq: 1, cq: 1, rd: 10, dl: 2, ch: 2, pq: .5, lq: 1 };
function dayPoints(d) {
  if (!d) return 0;
  let p = 0; for (const [k, w] of Object.entries(BRICK_W)) p += (+d[k] || 0) * w;
  p += Math.floor((+d.ls || 0) / 60) * 2;
  if (Array.isArray(d.ar)) p += d.ar.length * 10;
  return p;
}
function brickModel(log) {
  const days = log?.days || {};
  let total = 0; for (const k of Object.keys(days)) total += dayPoints(days[k]);
  total = Math.round(total * 10) / 10;
  const done = Math.floor(total / BRICK_PTS), frac = (total - done * BRICK_PTS) / BRICK_PTS;
  return { total, done, frac, today: dayPoints(days[today()]) };
}
// 第 n 块（从 0 数）砖是哪一天砌满的
function brickDate(log, n) {
  const days = log?.days || {}; let acc = 0; const need = (n + 1) * BRICK_PTS;
  for (const k of Object.keys(days).sort()) { acc += dayPoints(days[k]); if (acc >= need) return k; }
  return null;
}

   内页铺同一张纸的纹理，左上角一个手写的「回到塔前」。 */
const SHEETS = { en: SHEET_EN, ja: SHEET_JA, es: SHEET_ES };

const PAPER = { en: { base: "#e4cc9c", ink: "#2b2219" }, ja: { base: "#f2ede1", ink: "#1c1a18" }, es: { base: "#caa679", ink: "#1d140e" } };
function sheetState(lang, log) {
  const SH = SHEETS[lang], m = brickModel(log), group = Math.floor(m.done / SH.PER) + 1, idx = m.done % SH.PER;

function sheetVB(lang, W, H, st) {
  const SH = SHEETS[lang], h = 390 * H / W;
  let y = SH.anchor === "middle" ? (844 - h) / 2 : 844 - h;
  // 有「焦点」的图纸（日语）：当前段必须整段在画面里，下边留 40、上边留 90 给标注
  if (SH.focus && st) { const fc = SH.focus(st); y = Math.max(y, fc.bottom + 40 - h); y = Math.min(y, fc.top - 90); }

/* ---- 手绘线条素材：给内页的边框、分隔线、进度条用 ---- */
function paperAssets(lang) {
  const ink = PAPER[lang].ink, acc = { en: "#a33a26", ja: "#c0392b", es: "#9c2a1c" }[lang];
  const enc = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
  const r = SK.rng(lang.charCodeAt(0) * 7), j = a => ((r() * 2 - 1) * a).toFixed(2);
  const line = (w, n, op) => enc(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="8" viewBox="0 0 400 8" preserveAspectRatio="none">${[...Array(n)].map(() => `<path d="M${j(2)} ${4 + +j(.8)} Q${100 + +j(20)} ${4 + +j(1.6)} 200 ${4 + +j(.8)} T${400 + +j(2)} ${4 + +j(.8)}" stroke="${ink}" stroke-width="${w}" opacity="${op}" fill="none" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`).join("")}</svg>`);
  const frame = (c, w, op) => { const e = (x1, y1, x2, y2) => `<path d="M${(x1 + +j(1.2)).toFixed(1)} ${(y1 + +j(1.2)).toFixed(1)} Q${((x1 + x2) / 2 + +j(1.2)).toFixed(1)} ${((y1 + y2) / 2 + +j(1.2)).toFixed(1)} ${(x2 + +j(1.2)).toFixed(1)} ${(y2 + +j(1.2)).toFixed(1)}" stroke="${c}" stroke-width="${w}" opacity="${op}" fill="none" stroke-linecap="round"/>`; let s = ""; for (let k = 0; k < 2; k++) s += e(4, 7, 56, 6) + e(53, 3, 54, 57) + e(57, 53, 3, 54) + e(7, 57, 6, 3); return enc(`<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">${s}</svg>`); };
  const hatch = enc(`<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><path d="M-2 10 10 -2M-2 2 2 -2M6 10 10 6" stroke="${ink}" stroke-width="1.3" opacity=".85"/></svg>`);
  const st = document.documentElement.style;
  st.setProperty("--rline", line(1.1, 2, .6)); st.setProperty("--rline2", line(2, 3, .8)); st.setProperty("--rline-acc", line(1.4, 2, .9).replace(encodeURIComponent(ink), encodeURIComponent(acc)));
  st.setProperty("--rframe", frame(ink, 1.3, .7)); st.setProperty("--rframe-acc", frame(acc, 1.5, .85)); st.setProperty("--rframe-soft", frame(ink, 1, .4)); st.setProperty("--hatch", hatch);
}

const ARCHIVE_COLLS = ["app", "ja_app", "es_app", "content", "chap", "wp", "ja_wp", "es_wp", "mywords", "ja_mywords", "es_mywords", "audit", "decks", "deckwords", "srs"];
async function exportArchive() {
  await Saver.flush().catch(() => { });

  for (const c of ARCHIVE_COLLS) {

  }

function archiveSummary(a) {
  const keys = Object.keys(a.docs || {});
  const days = new Set(); for (const k of ["app/log", "ja_app/log", "es_app/log"]) for (const d of Object.keys(a.docs?.[k]?.days || {})) days.add(d);
  const last = [...days].sort().pop();

  return `${keys.length} 份记录 · 学习日 ${days.size} 天${last ? `（最近 ${last}）` : ""} · 英语进度 ${n("wp/")} 块 · 日语 ${n("ja_wp/")} 块 · 西语 ${n("es_wp/")} 块 · 文章 ${n("content/")} 篇`;
}
async function saveArchiveFile() {

  // claude.ai 里用平台的下载；App / 普通浏览器里直接下载
  let dl = null; try { dl = window.claude?.use ? await window.claude.use("downloads") : null; } catch { }
  if (dl) {
    try { await dl.save({ filename: name, data: new Blob([text], { type: "application/json" }) }); toast("存档已导出：" + archiveSummary(a), 5000); try { localStorage.setItem("bt_backup_at", today()); } catch { } }
    catch (e) { if (e?.code !== "declined") toast("导出失败：" + (e?.message || e?.code || "")); }

function parseOldMeaning(m) {
  return String(m || "").split(/\s+(?=(?:n|v|vt|vi|adj|adv|prep|conj|phr)\.)/).map(x => x.trim()).filter(Boolean).map(x => { const k = x.match(/^((?:n|v|vt|vi|adj|adv|prep|conj|phr)\.(?:\/[a-z]+\.)*)\s*(.*)$/); return k ? [k[1], k[2]] : ["", x]; });
}
// v2 → v3：旧词表的记忆记录按单词合并到新进度里；三册里没有的词放进生词本
async function migrateV3() {
  let decks = [];
  try { decks = await Store.list("decks"); } catch { }
  let moved = 0, toMy = 0;
  for (const d of decks) {
    const n = d.chunks || 0;
    for (let i = 0; i < n; i++) {
      const [ws, ss] = await Promise.all([Store.get(`deckwords/${d._id}_${i}`), Store.get(`srs/${d._id}_${i}`)]);
      const words = new Map((ws?.words || []).map(w => [w.w.toLowerCase(), w]));
      for (const [k, rec] of Object.entries(ss?.m || {})) {
        if (!Array.isArray(rec)) continue;
        if (!LEX.low.has(k) && !S.my.map.has(k)) { const w = words.get(k); if (!w) continue; addMyWord({ w: w.w, p: w.p, s: parseOldMeaning(w.m), x: w.e ? [[w.e, w.ez || ""]] : [], src: "v2" }); toMy++; }
        const old = prog(k);
        if (!old || old[0] < rec[0]) { setProg(k, [rec[0], rec[1], rec[2] || 0, rec[3] || 0, rec[4] || today(), old?.[5] || rec[4] || today()]); moved++; }
      }
    }
  }
  return { moved, toMy };
}
