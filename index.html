{"q": "Mr. Ito is ___ for training all new sales staff.", "o": ["response", "responsible", "responsibly", "responsibility"], "a": 1, "e": "be 动词后作表语，be responsible for 负责。"}]}, {"id": "t_verb", "name": "动词形式：时态·语态·主谓一致", "tag": "TOEIC Part 5", "intro": "<p>选项是同一动词的不同形式时，按顺序检查三件事：</p><ul><li><b>主谓一致</b>：主语单复数决定动词形式。注意插入语和介词短语会干扰：<i>The list of names <b>is</b> …</i>；each / every / either 作主语用单数。</li><li><b>语态</b>：主语是动作的执行者用主动，承受者用被动。空格后没有宾语时，被动的可能性大：<i>The package <b>was delivered</b> yesterday.</i></li><li><b>时态</b>：找时间标志词。since / for + 时间段 → 现在完成时；by the time / by next month → 将来完成时；last / ago / in 2023 → 过去时；next / tomorrow / soon → 将来。</li></ul><p>常考陷阱：<b>主将从现</b>——when / once / as soon as / before / until / if 引导的从句用一般现在时表将来：<i>once the contract <b>is signed</b></i>。建议、要求类动词（recommend, request, require, suggest, insist）后的 that 从句用动词原形：<i>We request that he <b>submit</b> …</i>。</p>", "q": [{"q": "The results of the customer survey ___ in the next newsletter.", "o": ["will publish", "will be published", "have published", "publishing"], "a": 1, "e": "results 是被发布的，且 next 提示将来，用将来时被动。"}, {"q": "Ms. Sato ___ at the firm for more than fifteen years.", "o": ["works", "is working", "has worked", "will work"], "a": 2, "e": "for more than fifteen years 表持续到现在，用现在完成时。"}, {"q": "Once the renovations ___, the lobby will reopen to the public.", "o": ["complete", "are completed", "will be completed", "completing"], "a": 1, "e": "once 引导时间状语从句，主将从现；renovations 是被完成的，用一般现在时被动。"}, {"q": "Each of the new laptops ___ with a one-year warranty.", "o": ["come", "comes", "coming", "have come"], "a": 1, "e": "Each of + 复数名词作主语，谓语用单数 comes。"}, {"q": "The manager requested that every employee ___ the safety training by Friday.", "o": ["completes", "completed", "complete", "will complete"], "a": 2, "e": "request that 从句用 (should) + 动词原形。"}, {"q": "By the time the new CEO arrives next month, the office ___ to the fifth floor.", "o": ["moves", "has moved", "will have moved", "moved"], "a": 2, "e": "by the time + 将来时间点，主句用将来完成时。"}, {"q": "The shipment ___ yesterday, but it has not arrived yet.", "o": ["sends", "was sent", "has been sending", "is sent"], "a": 1, "e": "yesterday 用过去时；货物是被发出的，用被动。"}, {"q": "A number of customers ___ about the new parking fees.", "o": ["has complained", "have complained", "complains", "is complaining"], "a": 1, "e": "a number of + 复数名词 表'许多'，谓语用复数；the number of 则用单数。"}]}, {"id": "t_pron", "name": "代词", "tag": "TOEIC Part 5", "intro": "<p>代词题四个选项通常是同一人称的不同格：he / him / his / himself。按空格位置选：</p><ul><li>动词前作主语 → 主格 <b>they / she</b></li><li>动词或介词后作宾语 → 宾格 <b>them / her</b></li><li>名词前 → 形容词性物主代词 <b>their / her</b></li><li>单独使用、后面没有名词 → 名词性物主代词 <b>theirs / hers</b></li><li>宾语就是主语本人，或用来强调 → 反身代词 <b>themselves</b>；by oneself = 独自</li></ul><p>其他常考：<b>those who</b> = 那些……的人；that / those 代替前面出现过的名词（<i>Our prices are lower than <b>those</b> of our competitors</i>）；another + 单数，other + 复数，the others = 其余全部。</p>", "q": [{"q": "Ms. Chen asked that all reports be sent directly to ___.", "o": ["she", "her", "hers", "herself"], "a": 1, "e": "介词 to 后作宾语，用宾格 her。"}, {"q": "The designers presented ___ ideas for the new logo.", "o": ["they", "them", "their", "theirs"], "a": 2, "e": "名词 ideas 前用形容词性物主代词 their。"}, {"q": "Mr. Park prefers to review the contracts ___ before sending them to the client.", "o": ["he", "him", "his", "himself"], "a": 3, "e": "强调亲自做，用反身代词 himself。"}, {"q": "If you left your umbrella in the lobby, please let us know which one is ___.", "o": ["you", "your", "yours", "yourself"], "a": 2, "e": "后面没有名词，用名词性物主代词 yours。"}, {"q": "Our shipping rates are lower than ___ of most online retailers.", "o": ["that", "those", "them", "it"], "a": 1, "e": "代替前面的复数名词 rates，用 those。"}, {"q": "A discount will be given to ___ who register before May 1.", "o": ["they", "them", "those", "these"], "a": 2, "e": "those who… 表示'那些……的人'。"}, {"q": "Two of the applicants have sales experience, but ___ do not.", "o": ["another", "other", "the others", "the other"], "a": 2, "e": "其余全部（复数）用 the others 代词形式。"}, {"q": "After reviewing the proposal, the committee members expressed ___ support for it.", "o": ["they", "their", "them", "theirs"], "a": 1, "e": "名词 support 前用 their。"}]}, {"id": "t_prep", "name": "介词与固定搭配", "tag": "TOEIC Part 5", "intro": "<p>介词题多靠<b>搭配</b>和<b>语义</b>判断：</p><ul><li>时间：<b>by</b>（最迟到某时，一次性完成）vs <b>until</b>（一直持续到某时）；<b>within</b> + 时间段（在…之内）；<b>during</b> + 名词（在…期间）；<b>for</b> + 时间段；<b>since</b> + 时间点</li><li>地点/位置：<b>at</b> the front desk，<b>on</b> the third floor，<b>in</b> the lobby，<b>throughout</b> the building（遍及），<b>along</b> the river</li><li>其他：<b>despite / in spite of</b> + 名词（尽管），<b>due to / because of</b> + 名词，<b>according to</b>（根据），<b>instead of</b>，<b>except for</b>，<b>among</b>（三者以上之中），<b>between</b>（两者之间）</li><li>高频搭配：responsible <b>for</b>，eligible <b>for</b>，familiar <b>with</b>，comply <b>with</b>，interested <b>in</b>，participate <b>in</b>，in charge <b>of</b>，on behalf <b>of</b>，in accordance <b>with</b>，prior <b>to</b>，access <b>to</b></li></ul>", "q": [{"q": "Please return the signed forms ___ Friday, June 12.", "o": ["until", "by", "within", "since"], "a": 1, "e": "表示'最迟在…之前完成'用 by；until 表示动作持续到某时。"}, {"q": "The store will remain open ___ 9 p.m. during the holiday season.", "o": ["by", "until", "at", "for"], "a": 1, "e": "营业状态一直持续到晚9点，用 until。"}, {"q": "Customers who are not satisfied may return the item ___ 30 days.", "o": ["within", "during", "since", "between"], "a": 0, "e": "within + 时间段，表示'在…之内'。"}, {"q": "___ the heavy rain, the outdoor concert was a great success.", "o": ["Although", "Despite", "Because", "However"], "a": 1, "e": "空格后是名词短语 the heavy rain，用介词 despite。although 后接从句。"}, {"q": "No food or drinks are allowed ___ the laboratory.", "o": ["inside", "upon", "among", "onto"], "a": 0, "e": "表示'在实验室里面'用 inside。"}, {"q": "Ms. Lopez was chosen ___ more than fifty candidates.", "o": ["between", "among", "through", "across"], "a": 1, "e": "三者以上之中用 among。"}, {"q": "Employees must comply ___ all company safety regulations.", "o": ["to", "for", "with", "at"], "a": 2, "e": "固定搭配 comply with 遵守。"}, {"q": "The shuttle bus runs every 20 minutes ___ the conference.", "o": ["while", "during", "meanwhile", "when"], "a": 1, "e": "during + 名词表示'在…期间'；while 是连词，后接从句。"}]}, {"id": "t_conj", "name": "连词、介词与连接副词", "tag": "TOEIC Part 5", "intro": "<p>意思相近的词分三类，<b>先看空格后的结构</b>再选：</p><ul><li><b>连词 + 完整句子</b>：although / even though（尽管），because / since（因为），while / whereas（而、然而），unless，once，as soon as，so that（以便）</li><li><b>介词 + 名词 / 动名词</b>：despite / in spite of，because of / due to，during，in addition to，instead of</li><li><b>连接副词</b>（前面通常有句号或分号，后面有逗号）：however，therefore，moreover / furthermore，otherwise，consequently，nevertheless</li></ul><p>成对连词也常考：both A <b>and</b> B，either A <b>or</b> B，neither A <b>nor</b> B，not only A <b>but also</b> B，whether A <b>or</b> B。</p>", "q": [{"q": "___ the budget was reduced, the team completed the project on time.", "o": ["Despite", "Although", "However", "Because of"], "a": 1, "e": "空格后是完整从句，且前后为让步关系，用连词 although。"}, {"q": "The flight was delayed ___ a problem with the engine.", "o": ["because", "since", "due to", "so that"], "a": 2, "e": "空格后是名词短语，用介词 due to。"}, {"q": "Sales rose sharply in May. ___, profits remained flat.", "o": ["However", "Although", "Despite", "Unless"], "a": 0, "e": "句首独立使用、后接逗号，用连接副词 however 表转折。"}, {"q": "Applicants must have either a degree in finance ___ three years of related experience.", "o": ["and", "nor", "or", "but"], "a": 2, "e": "either A or B 成对使用。"}, {"q": "Please back up your files regularly ___ you do not lose important data.", "o": ["so that", "in order to", "because", "as if"], "a": 0, "e": "so that 后接从句表目的；in order to 后接动词原形。"}, {"q": "The meeting will be canceled ___ at least five members can attend.", "o": ["unless", "otherwise", "despite", "whether"], "a": 0, "e": "unless = if not，'除非至少五人能出席，否则会议取消'。"}, {"q": "The new printer is not only faster ___ more energy efficient.", "o": ["and also", "but also", "or else", "as well"], "a": 1, "e": "not only A but also B 成对使用。"}, {"q": "Remember to save your work every few minutes; ___, you may lose your changes.", "o": ["therefore", "moreover", "otherwise", "meanwhile"], "a": 2, "e": "otherwise 表示'否则'，符合语义。"}]}, {"id": "t_rel", "name": "关系词（TOEIC 版）", "tag": "TOEIC Part 5", "intro": "<p>TOEIC 的关系词题关键是判断<b>先行词</b>和从句<b>缺什么</b>：</p><ul><li>先行词是人 + 从句缺主语 → <b>who</b>；缺宾语 → <b>whom / who / that</b>（可省略）</li><li>先行词是物 → <b>which / that</b></li><li>从句中需要“……的” → <b>whose</b> + 名词</li><li>从句完整、先行词是地点或时间 → <b>where / when</b></li><li>没有先行词、需要“……的东西” → <b>what</b>；“任何……的人” → <b>whoever</b></li></ul><p>注意：逗号后的非限制性从句不用 that；介词 + which / whom（<i>the team <b>to which</b> she belongs</i>）。</p>", "q": [{"q": "Employees ___ wish to attend the workshop should contact Mr. Ruiz.", "o": ["whose", "which", "who", "whom"], "a": 2, "e": "先行词是人，从句缺主语，用 who。"}, {"q": "The hotel, ___ was built in 1920, has recently been renovated.", "o": ["that", "which", "where", "what"], "a": 1, "e": "逗号后非限制性从句，先行词是物且从句缺主语，用 which。"}, {"q": "We are looking for a supplier ___ products meet our quality standards.", "o": ["who", "whose", "which", "whom"], "a": 1, "e": "'其产品'表示所属，用 whose + 名词。"}, {"q": "This is the conference room ___ the contract was signed.", "o": ["which", "what", "where", "whom"], "a": 2, "e": "从句 the contract was signed 完整，先行词是地点，用 where。"}, {"q": "___ the customers liked most about the store was its friendly staff.", "o": ["That", "Which", "What", "Who"], "a": 2, "e": "没有先行词，从句缺宾语，'顾客最喜欢的东西'用 what。"}, {"q": "The prize will be awarded to ___ submits the best design.", "o": ["whoever", "whomever", "whichever", "whose"], "a": 0, "e": "'任何提交最佳设计的人'，在从句中作主语，用 whoever。"}]}, {"id": "t_verbal", "name": "不定式、动名词与分词", "tag": "TOEIC Part 5", "intro": "<p>一个句子只能有一个谓语，其余动词变成 to do / doing / done。</p><ul><li>固定接 <b>to do</b>：plan, decide, hope, agree, intend, aim, strive, be able to, be likely to, be eager to；名词 + to do 表用途（<i>a way to reduce costs</i>）</li><li>固定接 <b>doing</b>：consider, suggest, recommend, avoid, finish, mind, look forward to, be committed to, be dedicated to（后三个的 to 是介词！）</li><li><b>分词作定语</b>：主动/进行用 -ing（<i>the staff <b>working</b> late</i>），被动/完成用 -ed（<i>the documents <b>attached</b> to this e-mail</i>）</li><li>情绪形容词：人感到 → -ed（interested, satisfied）；事物令人 → -ing（interesting, satisfying）</li></ul>", "q": [{"q": "We look forward to ___ with you on this project.", "o": ["work", "working", "worked", "be working"], "a": 1, "e": "look forward to 中的 to 是介词，后接动名词。"}, {"q": "The company plans ___ a new branch in Osaka next year.", "o": ["opening", "opened", "to open", "open"], "a": 2, "e": "plan to do 固定搭配。"}, {"q": "Please review the documents ___ to this e-mail.", "o": ["attach", "attaching", "attached", "to attach"], "a": 2, "e": "文件是被附上的，过去分词作后置定语。"}, {"q": "Ms. Ford suggested ___ the meeting to a larger room.", "o": ["move", "to move", "moving", "moved"], "a": 2, "e": "suggest doing 固定搭配。"}, {"q": "Visitors ___ to use the parking lot must register at the front desk.", "o": ["wish", "wishing", "wished", "to wish"], "a": 1, "e": "句中已有谓语 must register；访客主动'希望'，用现在分词作定语。"}, {"q": "Most attendees were very ___ with the quality of the presentations.", "o": ["satisfy", "satisfying", "satisfied", "satisfaction"], "a": 2, "e": "人感到满意用 -ed 形式 satisfied。"}, {"q": "Our team is committed to ___ excellent customer service.", "o": ["provide", "providing", "provided", "be provided"], "a": 1, "e": "be committed to 中的 to 是介词，接动名词。"}, {"q": "___ the report, Mr. Dunn noticed several errors in the figures.", "o": ["Review", "Reviewed", "While reviewing", "To be reviewed"], "a": 2, "e": "主语 Mr. Dunn 主动审阅，while + doing 表示'在…时'。"}]}, {"id": "t_comp", "name": "比较级、数量词与限定词", "tag": "TOEIC Part 5", "intro": "<ul><li>比较级标志：<b>than</b>、much / far / even / still + 比较级（<i>much <b>faster</b></i>）；最高级标志：<b>the</b> + -est / most，of all、in the company、ever</li><li>as + <b>原级</b> + as；the + 比较级, the + 比较级（越…越…）</li><li>可数复数：many, few, a few, several, a number of, fewer；不可数：much, little, a little, an amount of, less</li><li>单数可数名词：each, every, another, either；复数：all, both, most, other；<b>almost all</b> 而不是 almost + 名词</li><li>其他易错：most（大多数）vs almost（几乎，副词）；a few（一些）vs few（几乎没有）</li></ul>", "q": [{"q": "The new model is much ___ than the previous one.", "o": ["light", "lighter", "lightest", "more light"], "a": 1, "e": "much + 比较级，且有 than，用 lighter。"}, {"q": "This is the ___ successful product in our company's history.", "o": ["more", "most", "much", "very"], "a": 1, "e": "the + most + 形容词 构成最高级，in our company's history 提示最高级。"}, {"q": "___ employee must wear an ID badge in the building.", "o": ["All", "Every", "Most", "Several"], "a": 1, "e": "employee 是单数可数名词，用 every。"}, {"q": "We have received ___ complaints this month than last month.", "o": ["less", "fewer", "little", "much"], "a": 1, "e": "complaints 是可数复数，比较级用 fewer。"}, {"q": "___ all of the tickets were sold within an hour.", "o": ["Most", "Almost", "Mostly", "Much"], "a": 1, "e": "almost 修饰 all，表示'几乎全部'。"}, {"q": "The sooner you submit your order, ___ you will receive it.", "o": ["the sooner", "sooner", "soonest", "the soonest"], "a": 0, "e": "the + 比较级, the + 比较级 表'越…越…'。"}]}, {"id": "t_vocab", "name": "词汇题：搭配与语境", "tag": "TOEIC Part 5", "intro": "<p>选项词性相同、意思不同时，就是<b>词汇题</b>。解题靠两点：</p><ul><li><b>搭配</b>：TOEIC 反复考固定组合。<i>meet</i> a deadline / requirements，<i>place</i> an order，<i>make</i> a reservation / a decision，<i>conduct</i> a survey，<i>raise</i> funds，<i>address</i> a problem，<i>reach</i> an agreement，<i>issue</i> a refund，<i>take</i> effect，<i>pay</i> attention to</li><li><b>语境</b>：读整句，看逻辑关系。形容词题常见：<i>affordable</i> prices，<i>extensive</i> experience，<i>valid</i> ID，<i>prompt</i> reply，<i>considerable</i> amount，<i>tentative</i> schedule</li></ul><p>备考方法：背单词时连同例句里的搭配一起记，“单词”模块里 TOEIC 词表的例句都是按这个原则写的。</p>", "q": [{"q": "The team worked overtime to ___ the project deadline.", "o": ["reach", "meet", "make", "get"], "a": 1, "e": "meet a deadline 按期完成，固定搭配。"}, {"q": "To ___ an order, please call our customer service line.", "o": ["put", "place", "set", "take"], "a": 1, "e": "place an order 下订单。"}, {"q": "The research firm will ___ a survey of 2,000 shoppers.", "o": ["conduct", "perform", "act", "operate"], "a": 0, "e": "conduct a survey 开展调查。"}, {"q": "Please bring a ___ photo ID to the registration desk.", "o": ["valid", "valuable", "various", "vacant"], "a": 0, "e": "valid ID 有效证件。"}, {"q": "The new parking rules will take ___ on July 1.", "o": ["place", "effect", "part", "action"], "a": 1, "e": "take effect 生效；take place 是'举行、发生'。"}, {"q": "We will ___ a full refund if the item arrives damaged.", "o": ["issue", "raise", "draw", "claim"], "a": 0, "e": "issue a refund 办理退款（商家角度）。"}, {"q": "Ms. Tran has ___ experience in international trade.", "o": ["extensive", "expensive", "expansive", "extended"], "a": 0, "e": "extensive experience 丰富的经验。"}, {"q": "The committee needs more time to ___ the problem with the new system.", "o": ["address", "adapt", "admit", "advise"], "a": 0, "e": "address a problem 处理、解决问题。"}]}]);
READINGS.unshift(...[{"id": "t6_relocation", "level": "B1", "part": "Part 6", "title": "E-mail: Office Relocation", "topic": "段落填空", "text": "To: All Staff\nFrom: Helen Morris, Office Manager\nSubject: Office move\n\nAs you know, our team will be moving to the new building on Elm Street next month. The move is scheduled to take place over the weekend of April 12. ___(1)___, all employees are asked to pack their personal belongings by Thursday, April 10.\n\nBoxes and labels will be ___(2)___ to each department on Monday. Please write your name and new desk number clearly on every box. ___(3)___.\n\nComputers and printers will be moved by our IT team, so please do not pack any electronic equipment ___(4)___. If you have any questions, feel free to contact me directly.", "gloss": [["belongings", "私人物品"], ["label", "标签"], ["equipment", "设备"]], "q": [{"q": "第 (1) 空应填", "o": ["However", "Therefore", "Otherwise", "Meanwhile"], "a": 1, "e": "前文说搬迁安排在周末，所以（因此）员工需提前打包，用 therefore 表因果。"}, {"q": "第 (2) 空应填", "o": ["distribute", "distributing", "distributed", "distribution"], "a": 2, "e": "will be + 过去分词构成被动，箱子'被分发'。"}, {"q": "第 (3) 空应填", "o": ["The new building has a large cafeteria.", "This will help the movers place items at the correct desks.", "Thank you for attending the training session.", "Our IT team was hired last year."], "a": 1, "e": "句子插入题：前句要求在箱子上写姓名和新座位号，B 解释其目的，衔接最自然。"}, {"q": "第 (4) 空应填", "o": ["themselves", "yourself", "yours", "your own"], "a": 1, "e": "祈使句的逻辑主语是 you，用反身代词 yourself 表'自己动手'。"}]}, {"id": "t6_store", "level": "B1", "part": "Part 6", "title": "Notice: New Store Hours", "topic": "段落填空", "text": "Notice to Customers\n\nStarting May 1, Bellmore Hardware will ___(1)___ its weekday hours. The store will open at 7:00 a.m. instead of 9:00 a.m. to serve contractors and other early-morning customers.\n\nOur weekend hours will remain ___(2)___. We will continue to be open from 9:00 a.m. to 6:00 p.m. on Saturdays and Sundays.\n\n___(3)___. Customers can now order items online and pick them up at the store in as little as two hours.\n\nWe appreciate your business and look forward to ___(4)___ you soon.", "gloss": [["contractors", "承包商"], ["hardware", "五金"], ["pick up", "取（货）"]], "q": [{"q": "第 (1) 空应填", "o": ["extend", "extent", "extensive", "extensively"], "a": 0, "e": "will 后需要动词原形，extend 延长。"}, {"q": "第 (2) 空应填", "o": ["unchanged", "unchanging", "to change", "changes"], "a": 0, "e": "remain + 形容词，表示'保持不变'。下一句也证明周末时间不变。"}, {"q": "第 (3) 空应填", "o": ["We are also introducing a new service.", "The store was founded in 1985.", "Some items are out of stock.", "Parking is limited on weekdays."], "a": 0, "e": "后一句介绍网上下单、到店自提，A 引出新服务，衔接最自然。"}, {"q": "第 (4) 空应填", "o": ["see", "seeing", "seen", "be seen"], "a": 1, "e": "look forward to 中 to 是介词，接动名词 seeing。"}]}, {"id": "t7_furniture", "level": "B1", "part": "Part 7", "title": "Advertisement: Summit Office Furniture", "topic": "广告", "text": "Summit Office Furniture — Spring Sale!\n\nIs your office ready for an upgrade? From March 1 to March 15, all desks and chairs at Summit Office Furniture are 25 percent off.\n\nOur ergonomic chairs are designed to reduce back pain during long workdays, and our standing desks can be adjusted to any height at the touch of a button.\n\nBusinesses that order ten or more items will receive free delivery and assembly. Orders can be placed at any of our three locations or on our website, www.summitfurniture.com.\n\nNot sure what you need? Our design consultants will visit your office and suggest a layout at no charge. Call 555-0192 to schedule an appointment.", "gloss": [["ergonomic", "符合人体工学的"], ["assembly", "组装"], ["consultant", "顾问"], ["layout", "布局"]], "q": [{"q": "What is being advertised?", "o": ["A furniture sale", "A new office building", "A design course", "A delivery company"], "a": 0, "e": "标题和第一段：all desks and chairs … are 25 percent off."}, {"q": "How can customers receive free delivery?", "o": ["By shopping online", "By ordering ten or more items", "By visiting before March 1", "By becoming a member"], "a": 1, "e": "Businesses that order ten or more items will receive free delivery and assembly."}, {"q": "What service is offered at no charge?", "o": ["Furniture repair", "Removal of old furniture", "An office layout consultation", "An extended warranty"], "a": 2, "e": "Our design consultants will visit your office and suggest a layout at no charge."}]}, {"id": "t7_expense", "level": "B2", "part": "Part 7", "title": "Memo: New Expense Procedure", "topic": "内部备忘录", "text": "MEMO\nTo: All Employees\nFrom: Finance Department\nDate: June 2\nRe: Changes to expense reimbursement\n\nBeginning July 1, all requests for reimbursement of business expenses must be submitted through the new online system, ExpenseNow. Paper forms will no longer be accepted after June 30.\n\nTo submit a request, log in to ExpenseNow with your employee ID, enter the details of each expense, and upload a photo or scan of the original receipt. Requests will then be sent automatically to your supervisor for approval.\n\nOnce approved, payments will be added to your next paycheck. Under the old system, reimbursement could take up to six weeks; we expect ExpenseNow to reduce this to about ten days.\n\nTraining sessions on the new system will be held on June 15 and June 22 in Room 204. Employees who travel frequently are strongly encouraged to attend one of them. Anyone unable to attend may download a user guide from the company intranet.", "gloss": [["reimbursement", "报销"], ["receipt", "收据"], ["approval", "批准"], ["intranet", "内部网"], ["paycheck", "工资"]], "q": [{"q": "What is the purpose of the memo?", "o": ["To announce a change in procedure", "To introduce a new supervisor", "To report on travel costs", "To ask employees to reduce spending"], "a": 0, "e": "标题 Changes to expense reimbursement，全文介绍新报销流程。"}, {"q": "What must employees include with each request?", "o": ["A supervisor's signature", "A copy of the receipt", "A travel schedule", "A paper form"], "a": 1, "e": "upload a photo or scan of the original receipt."}, {"q": "According to the memo, what is one benefit of the new system?", "o": ["Employees can travel more often.", "Reimbursements will be paid more quickly.", "Supervisors will no longer need to approve expenses.", "Paper forms will be easier to complete."], "a": 1, "e": "从最多六周缩短到约十天，即付款更快。"}, {"q": "The word \"strongly\" in paragraph 4 is closest in meaning to", "o": ["physically", "firmly", "loudly", "heavily"], "a": 1, "e": "strongly encouraged 意为'强烈建议'，与 firmly 最接近。这是 Part 7 常见的同义词题。"}]}, {"id": "t7_bakery", "level": "B2", "part": "Part 7", "title": "Article: Local Bakery Expands", "topic": "报道", "text": "RIVERTON — Golden Crust Bakery, a family-owned business that began as a small stand at the Riverton farmers market twelve years ago, will open its fourth location on Main Street this fall.\n\nOwner Maya Singh says the company's growth has been driven largely by demand for its whole-grain breads, which are made using flour from local farms. \"Our customers care about where their food comes from,\" Ms. Singh said. \"Working with local growers has always been at the heart of what we do.\"\n\nThe new store will be larger than the existing ones and will include a seating area for thirty customers. It will also offer baking classes on weekend mornings, taught by the bakery's head baker, Tom Alvarez.\n\nTo staff the new location, Golden Crust plans to hire fifteen employees. Interested applicants can find more information on the bakery's website. The Main Street store is scheduled to open on October 5.", "gloss": [["stand", "摊位"], ["whole-grain", "全麦的"], ["growers", "种植者"], ["staff", "为…配备员工"]], "q": [{"q": "What is the article mainly about?", "o": ["A farmers market", "A business opening a new store", "A baking competition", "A change in ownership"], "a": 1, "e": "第一句：will open its fourth location."}, {"q": "How did Golden Crust Bakery begin?", "o": ["As a restaurant", "As a stand at a market", "As a farm", "As an online shop"], "a": 1, "e": "began as a small stand at the Riverton farmers market."}, {"q": "What is NOT mentioned about the new store?", "o": ["It will have seating.", "It will offer classes.", "It will sell coffee.", "It will be larger than the others."], "a": 2, "e": "NOT 题要逐项排除：座位、课程、面积都提到了，咖啡没提。"}, {"q": "The phrase \"at the heart of\" in paragraph 2 is closest in meaning to", "o": ["central to", "close to", "kind to", "next to"], "a": 0, "e": "at the heart of 表示'核心、中心'，与 central to 同义。"}]}, {"id": "t7_chat", "level": "B1", "part": "Part 7", "title": "Text Message Chain", "topic": "短信对话", "text": "Paul Kim [10:31 A.M.]\nHi Nadia, the client from Sato Industries just arrived. Are you still on your way?\n\nNadia Reyes [10:33 A.M.]\nYes, sorry. My train stopped for twenty minutes because of a signal problem. I should be there by 11:00.\n\nPaul Kim [10:34 A.M.]\nNo worries. Should I start the presentation without you?\n\nNadia Reyes [10:36 A.M.]\nThat would be great. The slides are in the shared folder. You can skip the budget section; I'll cover it when I get there.\n\nPaul Kim [10:37 A.M.]\nGot it. I'll order some coffee for the meeting room too.\n\nNadia Reyes [10:38 A.M.]\nPerfect. Thanks, Paul!", "gloss": [["signal", "信号"], ["shared folder", "共享文件夹"], ["cover", "讲解；负责"]], "q": [{"q": "Why is Ms. Reyes late?", "o": ["She missed her train.", "Her train was delayed.", "She went to the wrong office.", "She had another meeting."], "a": 1, "e": "My train stopped for twenty minutes because of a signal problem."}, {"q": "At 10:37 A.M., what does Mr. Kim most likely mean when he writes, \"Got it\"?", "o": ["He found the slides.", "He understands the instructions.", "He received a package.", "He has ordered coffee."], "a": 1, "e": "意图题：Got it 在这里是'明白了'，回应对方关于幻灯片和预算部分的安排。"}, {"q": "What will Ms. Reyes do when she arrives?", "o": ["Present the budget section", "Order coffee", "Meet a new client", "Fix the projector"], "a": 0, "e": "You can skip the budget section; I'll cover it when I get there."}]}, {"id": "t7_job", "level": "B1", "part": "Part 7", "title": "Job Posting: Customer Service Supervisor", "topic": "招聘启事", "text": "Customer Service Supervisor — Brightline Retail (Full-time)\n\nBrightline Retail is seeking an experienced customer service supervisor for its flagship store in Harbor City. The successful candidate will lead a team of twelve associates, handle customer complaints, and train new staff.\n\nRequirements:\n- At least three years of experience in retail, including one year in a supervisory role\n- Excellent communication skills\n- Ability to work weekends and holidays\n- Knowledge of a second language is preferred but not required\n\nWe offer a competitive salary, health insurance, and a 20 percent employee discount on all merchandise.\n\nTo apply, send your résumé and a cover letter to jobs@brightline.com by August 15. Only candidates selected for an interview will be contacted.", "gloss": [["flagship store", "旗舰店"], ["associates", "店员；员工"], ["supervisory", "监督的；管理的"], ["competitive", "有竞争力的"]], "q": [{"q": "What is one responsibility of the position?", "o": ["Designing store displays", "Training new employees", "Ordering merchandise", "Managing the website"], "a": 1, "e": "lead a team…, handle customer complaints, and train new staff."}, {"q": "What is NOT a requirement for the job?", "o": ["Retail experience", "Communication skills", "Weekend availability", "A second language"], "a": 3, "e": "第二语言是 preferred but not required，即优先而非必须。"}, {"q": "What is indicated about the application process?", "o": ["Applicants must apply in person.", "Not all applicants will be contacted.", "Interviews will be held on August 15.", "A reference letter is required."], "a": 1, "e": "Only candidates selected for an interview will be contacted."}]}, {"id": "t7_double", "level": "B2", "part": "Part 7", "title": "Double Passage: Conference Schedule & E-mail", "topic": "双篇阅读", "text": "—— Passage 1: Schedule ——\n\nNorthwest Marketing Conference — Day 2 (Saturday, October 18)\n\n9:00 – 10:00  Keynote: \"The Future of Social Media Advertising\" — Dr. Aiko Tanaka, Main Hall\n10:15 – 11:15  Workshop: Writing Effective Product Descriptions — Luis Moreno, Room A\n10:15 – 11:15  Panel: Marketing for Small Businesses — Room B\n11:30 – 12:30  Workshop: Measuring Campaign Results — Grace Obi, Room A\n12:30 – 1:30  Lunch (provided for all registered attendees), Terrace Café\n\n—— Passage 2: E-mail ——\n\nTo: Conference Registration <register@nwmarketing.org>\nFrom: Sam Hughes\nDate: October 10\nSubject: Registration question\n\nHello,\n\nI registered for both days of the conference last month. Unfortunately, I now have to attend a family event on Saturday morning, so I will not be able to arrive until 11:00. I am especially disappointed to miss Dr. Tanaka's talk. Will a recording of it be available afterward?\n\nAlso, since I will miss part of Day 2, is it possible to receive a partial refund?\n\nThank you,\nSam Hughes", "gloss": [["keynote", "主题演讲"], ["panel", "小组讨论"], ["partial", "部分的"], ["recording", "录像；录音"]], "q": [{"q": "What is indicated about lunch on October 18?", "o": ["It costs extra.", "It is served in the Main Hall.", "It is included for registered attendees.", "It starts at noon."], "a": 2, "e": "Lunch (provided for all registered attendees)."}, {"q": "Why is Mr. Hughes writing?", "o": ["To register for the conference", "To ask about a recording and a refund", "To offer to give a presentation", "To change his hotel reservation"], "a": 1, "e": "他问了录像是否可获得以及能否部分退款。"}, {"q": "What session will Mr. Hughes most likely be able to attend first?", "o": ["The keynote speech", "Writing Effective Product Descriptions", "Marketing for Small Businesses", "Measuring Campaign Results"], "a": 3, "e": "双篇关联题：他 11:00 才能到（Passage 2），按日程（Passage 1）最先赶上的是 11:30 的 Measuring Campaign Results。"}, {"q": "What is the topic of the session Mr. Hughes is disappointed to miss?", "o": ["Social media advertising", "Product descriptions", "Small business marketing", "Campaign results"], "a": 0, "e": "他遗憾错过 Dr. Tanaka 的演讲，日程显示题目是 The Future of Social Media Advertising。"}, {"q": "In the e-mail, the word \"especially\" in paragraph 1 is closest in meaning to", "o": ["finally", "particularly", "usually", "simply"], "a": 1, "e": "especially = particularly，'尤其'。"}]}, {"id": "t7_triple", "level": "B2", "part": "Part 7", "title": "Triple Passage: Hotel Web Page, Form & E-mail", "topic": "三篇阅读", "text": "—— Passage 1: Web page ——\n\nLakeside Hotel — Meeting Rooms\n\nThe Birch Room: seats 20, $300 per day, projector included\nThe Cedar Room: seats 50, $550 per day, projector and sound system included\nThe Grand Ballroom: seats 200, $1,800 per day, full audio-visual equipment and stage\n\nAll bookings include free Wi-Fi and coffee service. Lunch can be added for $25 per person. Bookings made at least 60 days in advance receive a 10 percent discount.\n\n—— Passage 2: Booking form ——\n\nName: Olivia Park, Fenwick Consulting\nDate of event: September 9\nDate of booking: June 20\nExpected number of guests: 45\nRoom requested: Cedar Room\nLunch: Yes (45 people)\nSpecial requests: A podium for the speaker\n\n—— Passage 3: E-mail ——\n\nTo: Olivia Park\nFrom: Events Team, Lakeside Hotel\nDate: June 21\n\nDear Ms. Park,\n\nThank you for choosing Lakeside Hotel for your event on September 9. Your booking has been confirmed, and your discount has been applied to the total. We are happy to provide a podium at no extra cost.\n\nPlease note that the Cedar Room will be undergoing minor renovations until August 31, but all work will be finished well before your event. If your number of guests changes, let us know at least one week in advance so that we can adjust your lunch order.\n\nBest regards,\nEvents Team", "gloss": [["podium", "讲台"], ["audio-visual", "视听的"], ["in advance", "提前"], ["undergoing", "正在经历"]], "q": [{"q": "According to the web page, what is included with every booking?", "o": ["A projector", "Lunch", "Coffee service", "A stage"], "a": 2, "e": "All bookings include free Wi-Fi and coffee service."}, {"q": "Why did Ms. Park receive a discount?", "o": ["She booked more than 60 days in advance.", "She ordered lunch for her guests.", "She is a regular customer.", "The room is being renovated."], "a": 0, "e": "三篇关联题：6月20日预订、9月9日举办，超过60天，符合网页上的提前预订折扣。"}, {"q": "What room size is most suitable for Ms. Park's event?", "o": ["20 seats", "50 seats", "200 seats", "45 seats is too many for any room"], "a": 1, "e": "45 位客人，Cedar Room 可坐 50 人。"}, {"q": "What does the hotel agree to provide free of charge?", "o": ["Lunch", "A sound system upgrade", "A podium", "Extra chairs"], "a": 2, "e": "We are happy to provide a podium at no extra cost."}, {"q": "What is Ms. Park asked to do?", "o": ["Pay a deposit by August 31", "Report any change in the number of guests", "Visit the room before the event", "Choose a lunch menu"], "a": 1, "e": "If your number of guests changes, let us know at least one week in advance."}]}]);
LISTENINGS.unshift(...[{"id": "p3_supplies", "level": "B1", "title": "Ordering Office Supplies", "topic": "Part 3 对话", "part": "Part 3", "voices": {"W": "af_bella", "M": "bm_george"}, "lines": [["W", "Hi, Daniel. I'm putting together this month's order for office supplies. Do you need anything for your team?", "嗨，丹尼尔。我在整理这个月的办公用品订单。你们组需要什么吗？"], ["M", "Actually, yes. We're almost out of printer toner, and a few people have asked for new desk lamps.", "其实需要。我们的打印机墨粉快用完了，还有几个人想要新台灯。"], ["W", "Toner is no problem, but lamps might be tricky. Our budget for furniture was cut this quarter.", "墨粉没问题，但台灯可能有点难办。这个季度的家具预算被削减了。"], ["M", "I see. Some of the lamps are broken, though, not just old. Could they count as equipment repairs?", "我明白。不过有些台灯是坏了，不只是旧。能算作设备维修吗？"], ["W", "That's a good point. If you send me a list of the broken ones, I'll check with the finance department.", "说得对。你把坏了的列个清单发给我，我去问问财务部。"], ["M", "Great, I'll e-mail it to you before lunch.", "好的，我午饭前发邮件给你。"]], "q": [{"q": "What is the woman doing?", "o": ["Repairing a printer", "Preparing a supply order", "Moving to a new office", "Planning a team lunch"], "a": 1, "e": "开头：I'm putting together this month's order for office supplies."}, {"q": "What problem does the woman mention?", "o": ["A delivery is late.", "A product is out of stock.", "A budget has been reduced.", "A form is missing."], "a": 2, "e": "Our budget for furniture was cut this quarter. —— cut = reduced（同义替换是 TOEIC 常见考法）。"}, {"q": "What will the man most likely do next?", "o": ["Visit the finance department", "Buy some lamps", "Send a list by e-mail", "Fix the broken lamps"], "a": 2, "e": "I'll e-mail it to you before lunch. —— it 指坏台灯清单。"}]}, {"id": "p3_dinner", "level": "B1", "title": "A Dinner Reservation", "topic": "Part 3 对话", "part": "Part 3", "voices": {"M": "am_michael", "W": "bf_emma"}, "lines": [["M", "Good afternoon, Harbor View Restaurant. How may I help you?", "下午好，港景餐厅。有什么可以帮您？"], ["W", "Hello, I'd like to book a table for eight people this Friday at seven. It's a dinner with some clients.", "您好，我想订本周五晚上七点八个人的位子，是和客户吃饭。"], ["M", "Let me check. I'm afraid our main dining room is fully booked at seven, but we have a private room available.", "我查一下。恐怕七点主餐厅已经订满了，不过我们有一个包间可以用。"], ["W", "A private room would actually be better for a business dinner. Is there an extra charge?", "包间其实更适合商务晚宴。需要额外收费吗？"], ["M", "There's no room fee, but there is a minimum order of three hundred dollars for the group.", "没有包间费，但整桌最低消费三百美元。"], ["W", "That shouldn't be a problem. Also, two of our guests are vegetarian.", "那应该没问题。另外，我们有两位客人吃素。"], ["M", "No problem. I'll make a note, and our chef can prepare a special vegetarian course.", "没问题。我记下来，我们的厨师可以准备一道特别的素食菜。"]], "q": [{"q": "Why is the woman calling?", "o": ["To cancel a booking", "To make a reservation", "To complain about a meal", "To order food for delivery"], "a": 1, "e": "I'd like to book a table for eight people. —— book = make a reservation。"}, {"q": "What does the man say about the private room?", "o": ["It has a view of the harbor.", "It requires a minimum order.", "It is closed on Fridays.", "It seats only six people."], "a": 1, "e": "there is a minimum order of three hundred dollars."}, {"q": "What does the woman mention about some guests?", "o": ["They will arrive late.", "They are clients from overseas.", "They do not eat meat.", "They need parking."], "a": 2, "e": "two of our guests are vegetarian —— 素食者即不吃肉。"}]}, {"id": "p3_launch", "level": "B2", "title": "Preparing a Product Launch", "topic": "Part 3 三人对话", "part": "Part 3", "voices": {"W": "af_heart", "M1": "am_michael", "M2": "bm_george"}, "lines": [["W", "Thanks for joining me. We need to finalize plans for the launch of our new fitness watch next month.", "谢谢你们来。我们需要敲定下个月新款运动手表的发布计划。"], ["M1", "The press release is almost done. I'm just waiting for the final price from the sales team.", "新闻稿差不多写好了，我只是在等销售团队给出最终定价。"], ["M2", "That's me. We've agreed on one hundred and ninety-nine dollars, but we'll offer a twenty percent discount for pre-orders.", "那是我这边的。我们定了199美元，但预订可享八折。"], ["W", "Good. What about the launch event? Has the venue been confirmed?", "好。发布活动呢？场地确定了吗？"], ["M1", "Not yet. The convention center we wanted is under renovation, so I'm looking at a hotel ballroom downtown instead.", "还没有。我们想用的会展中心在翻修，所以我在看市中心一家酒店的宴会厅。"], ["W", "That could work. Can you visit it this week and send us some photos?", "可以。你这周能去看一下，发些照片给我们吗？"], ["M1", "Sure, I'll go on Wednesday.", "好的，我周三去。"]], "q": [{"q": "What product are the speakers discussing?", "o": ["A smartphone", "A fitness watch", "A running shoe", "A laptop"], "a": 1, "e": "the launch of our new fitness watch."}, {"q": "What will customers receive if they pre-order?", "o": ["Free shipping", "A gift card", "A discount", "An extended warranty"], "a": 2, "e": "we'll offer a twenty percent discount for pre-orders."}, {"q": "Why is the convention center unavailable?", "o": ["It is being renovated.", "It is too expensive.", "It is fully booked.", "It is too small."], "a": 0, "e": "The convention center we wanted is under renovation."}]}, {"id": "p3_interview", "level": "B1", "title": "Scheduling an Interview", "topic": "Part 3 对话", "part": "Part 3", "voices": {"W": "bf_emma", "M": "am_michael"}, "lines": [["W", "Hello, this is Grace Liu from Norton Engineering. I'm calling about your application for the project coordinator position.", "您好，我是诺顿工程公司的刘格蕾丝。我打电话是关于您申请项目协调员职位的事。"], ["M", "Oh, hello! Thank you for calling.", "哦，您好！谢谢您来电。"], ["W", "We'd like to invite you for an interview. Would next Tuesday at ten a.m. work for you?", "我们想邀请您来面试。下周二上午十点您方便吗？"], ["M", "Unfortunately, I have a class on Tuesday mornings. Is there any time available in the afternoon?", "不巧，我周二上午有课。下午有时间吗？"], ["W", "Let me see… Yes, we could do two thirty. The interview will take about an hour, and you'll meet two of our senior engineers.", "我看看……可以，两点半行。面试大约一个小时，您会见到我们的两位资深工程师。"], ["M", "Two thirty is perfect. Should I bring anything with me?", "两点半很好。我需要带什么吗？"], ["W", "Please bring a copy of your portfolio. I'll send you directions to our office by e-mail.", "请带一份您的作品集。我会通过邮件把去我们办公室的路线发给您。"]], "q": [{"q": "What position has the man applied for?", "o": ["Senior engineer", "Project coordinator", "Office manager", "Sales assistant"], "a": 1, "e": "your application for the project coordinator position."}, {"q": "Why can't the man come on Tuesday morning?", "o": ["He has another interview.", "He is traveling.", "He has a class.", "He is working."], "a": 2, "e": "I have a class on Tuesday mornings."}, {"q": "What is the man asked to bring?", "o": ["A reference letter", "A portfolio", "A photo ID", "A certificate"], "a": 1, "e": "Please bring a copy of your portfolio."}]}, {"id": "p4_gate", "level": "B1", "title": "Airport Announcement", "topic": "Part 4 广播", "part": "Part 4", "voices": {"": "bm_george"}, "lines": [["", "Attention, passengers on Pacific Air flight 207 to Vancouver.", "乘坐太平洋航空207次航班前往温哥华的旅客请注意。"], ["", "Due to a scheduling change, your flight will now depart from Gate 32 instead of Gate 18.", "由于日程调整，您的航班现改在32号登机口登机，而不是18号。"], ["", "Boarding is expected to begin at four fifteen, about twenty minutes later than originally planned.", "预计四点十五分开始登机，比原计划晚约二十分钟。"], ["", "Gate 32 is located in the east wing of the terminal, a ten-minute walk from here.", "32号登机口位于航站楼东翼，从这里步行约十分钟。"], ["", "Passengers who need assistance getting to the new gate may ask any airline staff member for a wheelchair or a cart.", "需要协助前往新登机口的旅客，可向任何航空公司工作人员申请轮椅或电瓶车。"], ["", "We apologize for any inconvenience and thank you for flying with Pacific Air.", "对由此带来的不便我们深表歉意，感谢您选乘太平洋航空。"]], "q": [{"q": "What has changed about the flight?", "o": ["The destination", "The departure gate", "The airline", "The seat assignments"], "a": 1, "e": "depart from Gate 32 instead of Gate 18."}, {"q": "When will boarding begin?", "o": ["At 4:00", "At 4:15", "At 4:20", "At 4:35"], "a": 1, "e": "Boarding is expected to begin at four fifteen."}, {"q": "What can passengers ask staff for?", "o": ["A meal voucher", "A new ticket", "Help getting to the gate", "Information about hotels"], "a": 2, "e": "Passengers who need assistance getting to the new gate may ask any airline staff member."}]}, {"id": "p4_voicemail", "level": "B1", "title": "A Message from a Supplier", "topic": "Part 4 电话留言", "part": "Part 4", "voices": {"": "af_bella"}, "lines": [["", "Hi, Mr. Okafor, this is Linda Brooks from Greenleaf Paper Company, returning your call from this morning.", "您好，奥卡福先生，我是绿叶纸业的琳达·布鲁克斯，回复您今天上午的来电。"], ["", "You asked about the status of your order of five hundred boxes of printer paper.", "您询问了您订购的五百箱打印纸的状态。"], ["", "I'm sorry to say that the shipment has been delayed because our delivery truck broke down yesterday.", "很抱歉，由于我们的送货卡车昨天坏了，发货延误了。"], ["", "The order should now reach your office on Thursday instead of Tuesday.", "订单现在应该周四送到您的办公室，而不是周二。"], ["", "To make up for the delay, we'll take ten percent off your next invoice.", "为弥补这次延误，您下一张发票我们会打九折。"], ["", "If Thursday is too late, please call me back at 555-0148, and I'll see if we can send part of the order sooner.", "如果周四太晚，请回电555-0148，我看看能否先发一部分货。"]], "q": [{"q": "Why is the speaker calling?", "o": ["To confirm a price", "To explain a delay", "To request a payment", "To introduce a new product"], "a": 1, "e": "the shipment has been delayed…"}, {"q": "What caused the problem?", "o": ["Bad weather", "A vehicle problem", "A staff shortage", "A wrong address"], "a": 1, "e": "our delivery truck broke down —— truck broke down = a vehicle problem。"}, {"q": "What does the speaker offer?", "o": ["Free delivery", "A refund", "A discount on the next invoice", "Extra paper"], "a": 2, "e": "we'll take ten percent off your next invoice."}]}, {"id": "p4_tour", "level": "B2", "title": "Factory Tour", "topic": "Part 4 导览", "part": "Part 4", "voices": {"": "am_michael"}, "lines": [["", "Good morning, everyone, and welcome to the Brightway Foods production facility.", "大家早上好，欢迎来到明路食品的生产工厂。"], ["", "I'm Kevin, and I'll be leading your tour today. We'll spend about forty-five minutes on the factory floor.", "我是凯文，今天由我带大家参观。我们会在车间待大约四十五分钟。"], ["", "Before we start, please put on the safety glasses and hairnets in the box next to the door.", "开始之前，请戴上门边盒子里的护目镜和发网。"], ["", "Our first stop is the packaging area, where our new automated line can package up to three thousand cereal boxes an hour.", "第一站是包装区，那里的新自动化生产线每小时最多可包装三千盒麦片。"], ["", "Please note that photography is not allowed inside the building, as some of our equipment is protected by patents.", "请注意楼内禁止拍照，因为我们的部分设备受专利保护。"], ["", "At the end of the tour, we'll stop by the tasting room, where you can try some of our newest products.", "参观结束时，我们会去品尝室，大家可以试吃我们的一些新品。"]], "q": [{"q": "Who most likely is the speaker?", "o": ["A factory tour guide", "A safety inspector", "A new employee", "A food critic"], "a": 0, "e": "I'll be leading your tour today."}, {"q": "What are the listeners asked to do before the tour?", "o": ["Sign a form", "Turn off their phones", "Put on protective items", "Leave their bags"], "a": 2, "e": "put on the safety glasses and hairnets —— 护目镜和发网是防护用品。"}, {"q": "Why is photography not allowed?", "o": ["The area is dangerous.", "Some equipment is protected by patents.", "It disturbs the workers.", "The lighting is poor."], "a": 1, "e": "some of our equipment is protected by patents."}]}, {"id": "p4_news", "level": "B2", "title": "Local Business News", "topic": "Part 4 新闻", "part": "Part 4", "voices": {"": "bf_emma"}, "lines": [["", "In business news, the popular coffee chain Morning Brew announced yesterday that it will open fifteen new locations across the region over the next two years.", "商业新闻：知名咖啡连锁'晨酿'昨天宣布，将在未来两年内在本地区新开十五家门店。"], ["", "The expansion is expected to create around four hundred jobs.", "此次扩张预计将创造约四百个工作岗位。"], ["", "Company president Rita Gomez said the decision was based on strong sales at its existing stores, which grew by eighteen percent last year.", "公司总裁丽塔·戈麦斯表示，这一决定基于现有门店的强劲销售，去年增长了百分之十八。"], ["", "Several of the new cafés will include drive-through service, a first for the company.", "部分新店将提供免下车服务，这在该公司尚属首次。"], ["", "Morning Brew will hold a job fair at the city library on March the third for anyone interested in applying.", "晨酿将于三月三日在市图书馆举办招聘会，欢迎有意者前来应聘。"], ["", "Coming up after the break, we'll have the weekend weather forecast.", "休息之后，我们将播报周末天气预报。"]], "q": [{"q": "What is the news report mainly about?", "o": ["A company's expansion", "A new coffee product", "A change in leadership", "A drop in sales"], "a": 0, "e": "will open fifteen new locations —— 开新店即扩张。"}, {"q": "According to the speaker, what will be new for the company?", "o": ["Online ordering", "Drive-through service", "Delivery service", "Longer opening hours"], "a": 1, "e": "drive-through service, a first for the company."}, {"q": "What will happen on March 3?", "o": ["A store will open.", "A job fair will be held.", "A new president will start.", "Prices will increase."], "a": 1, "e": "will hold a job fair at the city library on March the third."}]}]);
const PART2 = [{"id": "p2_set1", "title": "应答问题 · 第 1 组", "topic": "Part 2 应答问题", "items": [{"qv": "am_michael", "q": "Where should I put these boxes?", "ov": "af_heart", "o": ["By the end of the day.", "In the storage room, please.", "Yes, I put them there."], "a": 1, "e": "Where 问地点，B 回答'储藏室'。A 答时间，C 用 Yes 回答特殊疑问句，都不对。"}, {"qv": "bf_emma", "q": "When does the training session start?", "ov": "am_michael", "o": ["In Conference Room B.", "It was very useful.", "Right after lunch."], "a": 2, "e": "When 问时间，C'午饭后'。A 答地点，B 答评价。"}, {"qv": "af_heart", "q": "Who's in charge of ordering office supplies?", "ov": "bm_george", "o": ["Maria handles that now.", "The supplies are on the shelf.", "About fifty dollars."], "a": 0, "e": "Who 问人。A 给出负责人。B 重复 supplies 是干扰词陷阱。"}, {"qv": "bm_george", "q": "Why was the meeting moved to Thursday?", "ov": "af_heart", "o": ["At two o'clock.", "Because the director is traveling.", "Yes, I moved it."], "a": 1, "e": "Why 问原因，B 用 because 说明。"}, {"qv": "am_michael", "q": "Would you like me to print the agenda for you?", "ov": "bf_emma", "o": ["Thanks, that would be helpful.", "He printed it last week.", "The printer is new."], "a": 0, "e": "提供帮助的问句，A 接受帮助。C 重复 print 发音相近词是陷阱。"}, {"qv": "af_heart", "q": "How long will the repairs take?", "ov": "am_michael", "o": ["About two hours.", "At the service center.", "They're very expensive."], "a": 0, "e": "How long 问时长。"}, {"qv": "bf_emma", "q": "You've already sent the invoice, haven't you?", "ov": "bm_george", "o": ["No, I'll do it this afternoon.", "Send it to the client.", "The voice was clear."], "a": 0, "e": "反义疑问句确认事实，A 否定并说明安排。C 的 voice 与 invoice 发音相近是陷阱。"}, {"qv": "am_michael", "q": "Should we take a taxi or walk to the restaurant?", "ov": "af_heart", "o": ["Yes, we should.", "It's only five minutes away.", "I had the pasta."], "a": 1, "e": "选择疑问句不能用 Yes/No 回答。B 间接回答'只有五分钟路程'，意思是走过去。"}, {"qv": "bm_george", "q": "Why don't we ask Ken to lead the project?", "ov": "bf_emma", "o": ["Because he's on vacation.", "That's a great idea.", "He led the way."], "a": 1, "e": "Why don't we… 是提建议，不是问原因。B 表示同意。A 是典型陷阱。"}, {"qv": "af_heart", "q": "The new menu will be ready next week.", "ov": "am_michael", "o": ["Great, I can't wait to see it.", "It's a nice restaurant.", "Ready for what?"], "a": 0, "e": "陈述句，A 做出自然回应。"}, {"qv": "am_michael", "q": "Isn't the store open on Sundays?", "ov": "bf_emma", "o": ["Only in December.", "Please open the window.", "I bought it on Sunday."], "a": 0, "e": "否定疑问句问是否营业，A'只在十二月'是间接回答。"}, {"qv": "bf_emma", "q": "Could you help me move this desk?", "ov": "bm_george", "o": ["Sure, where do you want it?", "It's a wooden desk.", "He moved to Chicago."], "a": 0, "e": "请求帮助，A 答应并追问位置。"}], "part": "Part 2"}, {"id": "p2_set2", "title": "应答问题 · 第 2 组", "topic": "Part 2 应答问题", "items": [{"qv": "af_heart", "q": "Has the shipment from Denver arrived yet?", "ov": "am_michael", "o": ["It's expected tomorrow morning.", "I've never been to Denver.", "Yes, ship it today."], "a": 0, "e": "问是否到了，A 间接回答'预计明早到'。"}, {"qv": "bm_george", "q": "What time does the last train leave?", "ov": "af_heart", "o": ["From platform four.", "At eleven fifteen.", "It was crowded."], "a": 1, "e": "What time 问时间。"}, {"qv": "am_michael", "q": "Which of these designs do you prefer?", "ov": "bf_emma", "o": ["The one with the blue logo.", "I designed it myself.", "Yes, I prefer it."], "a": 0, "e": "Which 问选择哪个，A 指出具体一个。"}, {"qv": "bf_emma", "q": "How many people signed up for the workshop?", "ov": "am_michael", "o": ["Around thirty so far.", "On the second floor.", "Sign here, please."], "a": 0, "e": "How many 问数量。C 的 sign 是重复词陷阱。"}, {"qv": "af_heart", "q": "I can't find the report you mentioned.", "ov": "bm_george", "o": ["It's in the shared folder.", "Yes, I mentioned it.", "A two-page report."], "a": 0, "e": "陈述找不到报告，A 告知位置。"}, {"qv": "am_michael", "q": "Do you know who won the sales award?", "ov": "af_heart", "o": ["It was announced at the dinner.", "Jenny from the Boston office.", "The sales went up."], "a": 1, "e": "Do you know who… 真正问的是'谁'，B 给出人名。"}, {"qv": "bm_george", "q": "Let's review the budget before the meeting.", "ov": "bf_emma", "o": ["Good idea. I'll bring the numbers.", "The meeting was long.", "I reviewed the movie."], "a": 0, "e": "提议，A 同意并补充行动。"}, {"qv": "bf_emma", "q": "Where can I get a parking permit?", "ov": "am_michael", "o": ["It costs twenty dollars.", "From the security office.", "I parked over there."], "a": 1, "e": "Where 问地点。"}, {"qv": "af_heart", "q": "Why hasn't the air conditioner been fixed?", "ov": "bm_george", "o": ["The technician is on his way.", "It's cooler today.", "Yes, it was fixed."], "a": 0, "e": "问为什么还没修，A 说明技术员正在路上，间接回应。"}, {"qv": "am_michael", "q": "Would you rather meet in the morning or the afternoon?", "ov": "af_heart", "o": ["Either works for me.", "It was a good meeting.", "Every morning."], "a": 0, "e": "选择疑问句，A'都可以'是常见正确答案。"}], "part": "Part 2"}];

{ id:"b_pos", name:"词性：单词的八种身份", tag:"零基础 · 第 1 课",
intro:`<p>英语里每个词都有一个“身份”，叫<b>词性</b>。知道词性，才知道它能放在句子的什么位置。TOEIC Part 5 有三分之一的题就是在考词性。</p>
<ul><li><b>名词 n.</b>：人、物、事的名字。<i>manager, office, meeting</i></li>
<li><b>动词 v.</b>：动作或状态。<i>work, send, is</i></li>
<li><b>形容词 adj.</b>：描述名词“怎么样”。<i>new, busy, important</i></li>
<li><b>副词 adv.</b>：描述动作“怎么做”，常以 -ly 结尾。<i>quickly, carefully</i></li>
<li><b>代词 pron.</b>：代替名词。<i>I, you, it, they</i></li>
<li><b>介词 prep.</b>：放在名词前表示时间、地点、关系。<i>in, on, at, for, with</i></li>
<li><b>连词 conj.</b>：连接词或句子。<i>and, but, because</i></li>
<li><b>冠词 art.</b>：a / an / the，放在名词前。</li></ul>
<p>看后缀能猜词性：<b>-tion, -ment, -ness, -er</b> 多是名词；<b>-ful, -ive, -able, -al</b> 多是形容词；<b>-ly</b> 多是副词；<b>-ize, -ify, -en</b> 多是动词。</p>
<p>例：<i>The <b>new</b>(adj.) <b>manager</b>(n.) <b>speaks</b>(v.) <b>clearly</b>(adv.).</i> 新经理说话很清楚。</p>`,
q:[
{q:"In the sentence “She works quickly.”, the word “quickly” is a ___.",o:["noun","verb","adjective","adverb"],a:3,e:"quickly 以 -ly 结尾，修饰动词 works，说明“怎么工作”，是副词。"},
{q:"Which word is a noun?",o:["decide","decision","decisive","decisively"],a:1,e:"-sion 是名词后缀，decision 意为“决定”。decide 动词，decisive 形容词，decisively 副词。"},
{q:"Which word is an adjective?",o:["careful","care","carefully","cares"],a:0,e:"-ful 是形容词后缀，careful 意为“小心的”。"},
{q:"The ___ of the new office is next month.",o:["open","opening","opened","opens"],a:1,e:"the 后面、of 前面需要名词，opening 可作名词“开业”。"},
{q:"Our team had a very ___ meeting today.",o:["product","produce","productive","productively"],a:2,e:"a very ___ meeting：修饰名词 meeting 要用形容词 productive（高效的）。"},
{q:"Please read the instructions ___.",o:["careful","care","carefully","carefulness"],a:2,e:"修饰动词 read（怎么读）用副词 carefully。"}]},

{ id:"b_parts", name:"句子成分：主语、谓语、宾语", tag:"零基础 · 第 2 课",
intro:`<p>一个完整的英语句子，至少要有<b>主语</b>（谁）和<b>谓语动词</b>（做什么/是什么）。</p>
<ul><li><b>主语</b>：动作的发出者，一般在句首。<i><b>The manager</b> signed the contract.</i></li>
<li><b>谓语</b>：句子的核心动词。<i>The manager <b>signed</b> the contract.</i></li>
<li><b>宾语</b>：动作的对象，放在动词后。<i>The manager signed <b>the contract</b>.</i></li>
<li><b>表语</b>：跟在 be 动词等“系动词”后面，说明主语的状态。<i>The room is <b>clean</b>.</i></li>
<li><b>定语</b>：修饰名词的成分（形容词等）。<i>a <b>big</b> order</i></li>
<li><b>状语</b>：说明时间、地点、方式等。<i>We met <b>in the lobby</b> <b>yesterday</b>.</i></li></ul>
<p>中文可以没有动词（“我很忙”），英语必须有动词：<i>I <b>am</b> busy.</i> 这是中国学生最常犯的错。</p>
<p>一个句子里通常只能有<b>一个</b>谓语动词；想再加动作，要用 and 连接或用从句。</p>`,
q:[
{q:"In “The customer called the store.”, what is the subject (主语)?",o:["The customer","called","the store","store"],a:0,e:"动作 called 的发出者是 The customer，它是主语。"},
{q:"In “Our sales increased last year.”, what is the verb (谓语)?",o:["Our","sales","increased","last year"],a:2,e:"increased（增长了）是句子的谓语动词。"},
{q:"Which sentence is correct?",o:["I busy today.","I am busy today.","I being busy today.","I is busy today."],a:1,e:"英语句子必须有谓语动词；I 搭配 am。"},
{q:"The report ___ on your desk.",o:["is","it","be","being"],a:0,e:"句子缺谓语动词，the report 是单数，用 is。"},
{q:"In “She sent me an email.”, “an email” is the ___.",o:["subject","verb","object","adverb"],a:2,e:"sent 的对象是 an email，是宾语（直接宾语）。"},
{q:"Which word tells us WHEN in “We will meet tomorrow.”?",o:["We","will","meet","tomorrow"],a:3,e:"tomorrow 说明时间，是时间状语。"}]},

{ id:"b_five", name:"五种基本句型", tag:"零基础 · 第 3 课",
intro:`<p>英语再长的句子，骨架都是下面五种之一。先找到骨架，长句就不怕了。</p>
<ul><li><b>主 + 谓</b>：<i>The meeting started.</i> 会议开始了。</li>
<li><b>主 + 系 + 表</b>：<i>The price is reasonable.</i> 价格合理。（系动词：be, look, seem, become, sound, feel）</li>
<li><b>主 + 谓 + 宾</b>：<i>We need a new printer.</i> 我们需要一台新打印机。</li>
<li><b>主 + 谓 + 间宾 + 直宾</b>：<i>She gave me the file.</i> 她给了我文件。（给谁 + 给什么）</li>
<li><b>主 + 谓 + 宾 + 宾补</b>：<i>The news made everyone happy.</i> 这个消息让大家都很高兴。</li></ul>
<p>注意系动词后面接<b>形容词</b>，不接副词：<i>The plan sounds <b>good</b>.</i>（不是 well）</p>
<p>长句里的介词短语、从句大多是“装饰”。例如 <i>The new manager <u>from Osaka</u> gave us a short speech <u>at the party</u>.</i> 骨架就是 manager gave us a speech。</p>`,
q:[
{q:"“The shop closes at nine.” uses which pattern?",o:["主+谓","主+系+表","主+谓+宾","主+谓+宾+宾补"],a:0,e:"The shop（主）closes（谓），at nine 是时间状语，骨架是主+谓。"},
{q:"“Your idea sounds ___.”",o:["well","good","goodly","to good"],a:1,e:"sound 是系动词，后面接形容词作表语：sounds good。"},
{q:"Which sentence has two objects (给谁 + 给什么)?",o:["He is a driver.","He bought a car.","He showed us the car.","He drives carefully."],a:2,e:"showed（谓）us（间接宾语）the car（直接宾语）。"},
{q:"The long meeting made everyone ___.",o:["tire","tired","tiredly","to tired"],a:1,e:"make + 宾语 + 形容词（宾补）：made everyone tired。"},
{q:"The customer looked ___ with the service.",o:["happy","happily","happiness","happier than"],a:0,e:"look 表示“看起来”时是系动词，接形容词 happy。"},
{q:"Find the core (骨架) of: “The new printer on the third floor works very well.”",o:["printer works","new printer","third floor","very well"],a:0,e:"主语 printer + 谓语 works 是骨架，其余都是修饰。"}]},

{ id:"b_be", name:"be 动词：am / is / are / was / were", tag:"零基础 · 第 4 课",
intro:`<p>be 动词表示“是、在、处于某种状态”，是英语里最常用的动词。</p>
<ul><li><b>I am</b> · <b>he / she / it / 单数名词 is</b> · <b>you / we / they / 复数名词 are</b></li>
<li>过去时：I / he / she / it → <b>was</b>；you / we / they → <b>were</b></li>
<li>否定：直接在 be 后加 not：<i>She is not (isn't) here.</i></li>
<li>疑问：把 be 提到主语前：<i>Are you ready? — Yes, I am.</i></li></ul>
<p><b>There be</b> 句型表示“某处有某物”，be 跟后面的名词保持一致：<i>There <b>is</b> a meeting today.</i> / <i>There <b>are</b> two meetings today.</i></p>
<p>常见错误：<i>The files is ready.</i> ✗ → files 是复数，应该用 <b>are</b>。</p>`,
q:[
{q:"The documents ___ on the table.",o:["is","am","are","be"],a:2,e:"documents 是复数，用 are。"},
{q:"My manager ___ in Tokyo last week.",o:["is","was","were","are"],a:1,e:"last week 是过去时间，manager 单数，用 was。"},
{q:"There ___ a problem with the printer.",o:["is","are","were","be"],a:0,e:"There be 句型看后面的名词：a problem 单数，用 is。"},
{q:"___ you at the office yesterday?",o:["Was","Were","Are","Is"],a:1,e:"疑问句把 be 提前；you 的过去式 be 是 were。"},
{q:"The new staff members ___ very friendly.",o:["is","was","are","be"],a:2,e:"members 是复数，现在时用 are。"},
{q:"There ___ many visitors at the trade show yesterday.",o:["was","were","is","are"],a:1,e:"many visitors 复数 + yesterday 过去，用 were。"}]},

{ id:"b_noun", name:"名词：单复数与可数不可数", tag:"零基础 · 第 5 课",
intro:`<p><b>可数名词</b>能数“一个、两个”，复数一般加 -s：<i>a file → two files</i>。</p>
<ul><li>以 s, x, ch, sh 结尾加 -es：<i>box → boxes, branch → branches</i></li>
<li>辅音 + y 结尾，变 y 为 i 加 -es：<i>company → companies</i></li>
<li>不规则：<i>man → men, woman → women, person → people, child → children</i></li></ul>
<p><b>不可数名词</b>不能直接数，没有复数，前面不用 a/an：<i>information, advice, equipment, furniture, money, luggage, news, feedback</i>。要数它们就用量词：<i>a piece of advice</i>。</p>
<p>搭配：可数用 <b>many / a few / few</b>，不可数用 <b>much / a little / little</b>；<b>a lot of / some / any</b> 两者都可以。</p>
<p>TOEIC 常考：<i>The equipment <b>is</b> new.</i>（不可数名词作主语，动词用单数）</p>`,
q:[
{q:"We need more ___ about the project.",o:["informations","information","an information","many information"],a:1,e:"information 不可数，没有复数，不加 a。"},
{q:"There are three ___ in our city.",o:["branch","branchs","branches","branches'"],a:2,e:"ch 结尾的名词复数加 -es：branches。"},
{q:"How ___ money do we have for the event?",o:["many","much","few","a few"],a:1,e:"money 不可数，问“多少”用 how much。"},
{q:"Two new ___ joined the team today.",o:["person","persons","people","peoples"],a:2,e:"person 的复数常用 people。"},
{q:"The office ___ was delivered this morning.",o:["furniture","furnitures","a furniture","furniture are"],a:0,e:"furniture 不可数，没有复数形式。"},
{q:"She gave me a useful piece of ___.",o:["advices","advice","advise","advised"],a:1,e:"advice 名词不可数，a piece of advice；advise 是动词。"}]},

{ id:"b_article", name:"冠词：a / an / the", tag:"零基础 · 第 6 课",
intro:`<ul><li><b>a / an</b>：“一个”，第一次提到的、泛指的<b>单数可数名词</b>。读音以元音开头用 <b>an</b>：<i>an office, an hour</i>（h 不发音），<i>a university</i>（发 /j/ 音）。</li>
<li><b>the</b>：特指，双方都知道是哪一个。第二次提到、独一无二的东西、有修饰限定的名词：<i>I bought a laptop. <b>The</b> laptop is fast.</i> / <i>the sun</i> / <i>the report on your desk</i></li>
<li>不用冠词：泛指复数或不可数名词，<i>Computers are useful.</i>；三餐、学科、语言、星期前一般不用：<i>have lunch, on Monday</i>。</li></ul>
<p>固定表达：<i>at the moment, in the morning, by the way, on time, at work, by bus</i>。</p>`,
q:[
{q:"I have ___ appointment at three.",o:["a","an","the","（不填）"],a:1,e:"appointment 以元音音素开头，用 an。"},
{q:"She works at ___ university in Osaka.",o:["a","an","the","（不填）"],a:0,e:"university 开头发 /j/ 音（辅音），用 a。"},
{q:"We ordered a new copier. ___ copier arrived today.",o:["A","An","The","（不填）"],a:2,e:"第二次提到同一台复印机，用 the 特指。"},
{q:"Please send me ___ report on your desk.",o:["a","an","the","（不填）"],a:2,e:"有 on your desk 限定，是特指，用 the。"},
{q:"The flight takes about ___ hour.",o:["a","an","the","（不填）"],a:1,e:"hour 的 h 不发音，以元音开头，用 an。"},
{q:"Let's have ___ lunch together.",o:["a","an","the","（不填）"],a:3,e:"三餐前一般不用冠词：have lunch。"}]},

{ id:"b_pron", name:"代词：I / me / my / mine / myself", tag:"零基础 · 第 7 课",
intro:`<table><tr><th>主格（作主语）</th><th>宾格（作宾语）</th><th>形容词性物主（+名词）</th><th>名词性物主（单独用）</th><th>反身</th></tr>
<tr><td>I</td><td>me</td><td>my</td><td>mine</td><td>myself</td></tr>
<tr><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourself</td></tr>
<tr><td>he</td><td>him</td><td>his</td><td>his</td><td>himself</td></tr>
<tr><td>she</td><td>her</td><td>her</td><td>hers</td><td>herself</td></tr>
<tr><td>it</td><td>it</td><td>its</td><td>—</td><td>itself</td></tr>
<tr><td>we</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr>
<tr><td>they</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr></table>
<ul><li>动词、介词后面用宾格：<i>Call <b>me</b>. / with <b>them</b></i></li>
<li>名词前用 my / your / their…：<i><b>their</b> office</i></li>
<li>反身代词：自己做、亲自：<i>She did it <b>herself</b>.</i> / <i>by <b>himself</b></i>（独自）</li></ul>
<p>TOEIC 最爱考 <b>its</b>（它的）和 <b>it's</b>（it is）的区别，以及 their / them / theirs。</p>`,
q:[
{q:"Please send the file to ___.",o:["I","me","my","mine"],a:1,e:"介词 to 后面用宾格 me。"},
{q:"The company announced ___ new policy.",o:["it","its","it's","itself"],a:1,e:"名词 policy 前要用形容词性物主代词 its（它的）。"},
{q:"This desk is ___, not yours.",o:["my","me","mine","myself"],a:2,e:"单独使用、后面没有名词，用名词性物主代词 mine。"},
{q:"The clients will present ___ ideas tomorrow.",o:["they","them","their","theirs"],a:2,e:"名词 ideas 前用 their。"},
{q:"Mr. Kim prepared the report by ___.",o:["him","his","he","himself"],a:3,e:"by oneself 表示“独自”，用反身代词 himself。"},
{q:"Ms. Lee asked ___ to join the meeting.",o:["we","us","our","ours"],a:1,e:"asked 后面作宾语用宾格 us。"}]},

{ id:"b_present", name:"一般现在时（三单加 -s）", tag:"零基础 · 第 8 课",
intro:`<p><b>什么时候用</b>：习惯、经常发生的事、事实、时刻表。标志词：<i>every day, usually, often, always, sometimes, on Mondays</i>。</p>
<ul><li>主语是 <b>he / she / it / 单数名词</b>（第三人称单数）时，动词加 <b>-s / -es</b>：<i>She <b>works</b> in sales. The store <b>opens</b> at ten.</i></li>
<li>其他主语用原形：<i>I / You / We / They <b>work</b> here.</i></li>
<li>加 -es：<i>go → goes, watch → watches, finish → finishes</i>；辅音+y：<i>study → studies</i>；特殊：<i>have → has</i></li>
<li>否定和疑问借助 <b>do / does</b>，后面动词回到原形：<i>He <b>doesn't</b> work on Sundays. <b>Does</b> the bus stop here?</i></li></ul>`,
q:[
{q:"The train ___ at 8:15 every morning.",o:["leave","leaves","leaving","is leave"],a:1,e:"时刻表用一般现在时，the train 单数，加 -s。"},
{q:"My colleagues usually ___ lunch at noon.",o:["has","have","having","is having"],a:1,e:"colleagues 复数，动词用原形 have。"},
{q:"She ___ the office supplies every Friday.",o:["order","orders","ordering","to order"],a:1,e:"she 是第三人称单数，orders。"},
{q:"Mr. Park ___ not drive to work.",o:["do","does","is","did not"],a:1,e:"第三人称单数否定用 does not。"},
{q:"___ the store open on Sundays?",o:["Do","Does","Is it","Are"],a:1,e:"the store 单数，一般疑问句用 Does，后接原形 open。"},
{q:"He ___ to the gym twice a week.",o:["go","goes","gos","going"],a:1,e:"go 的三单形式是 goes。"}]},

{ id:"b_past", name:"一般过去时", tag:"零基础 · 第 9 课",
intro:`<p><b>什么时候用</b>：过去某个时间发生、已经结束的事。标志词：<i>yesterday, last week, in 2020, two days ago</i>。</p>
<ul><li>规则动词加 <b>-ed</b>：<i>work → worked, arrive → arrived, stop → stopped, study → studied</i></li>
<li>不规则动词要单独记：<i>go → went, have → had, send → sent, buy → bought, meet → met, take → took, make → made, leave → left</i></li>
<li>否定和疑问借助 <b>did</b>，动词回到原形：<i>I <b>didn't</b> receive the email. <b>Did</b> you call him?</i></li></ul>
<p>注意：一旦用了 did，后面的动词就不能再用过去式了：<i>Did you <b>send</b> it?</i>（不是 sent）</p>`,
q:[
{q:"We ___ the contract yesterday.",o:["sign","signs","signed","signing"],a:2,e:"yesterday 表示过去，用过去式 signed。"},
{q:"She ___ to Singapore last month.",o:["go","goes","went","gone"],a:2,e:"go 的过去式是不规则的 went。"},
{q:"I didn't ___ your message.",o:["receive","received","receives","receiving"],a:0,e:"didn't 后面动词用原形。"},
{q:"Did the package ___ on time?",o:["arrived","arrive","arrives","arriving"],a:1,e:"did 疑问句后接动词原形 arrive。"},
{q:"The company ___ a new product two weeks ago.",o:["launch","launches","launched","has launch"],a:2,e:"two weeks ago 是过去时间，用 launched。"},
{q:"They ___ a lot of new customers last year.",o:["meet","met","meeted","meets"],a:1,e:"meet 的过去式是 met。"}]},

{ id:"b_future", name:"将来时：will 与 be going to", tag:"零基础 · 第 10 课",
intro:`<ul><li><b>will + 动词原形</b>：将来的事实、临时决定、承诺。<i>The meeting <b>will start</b> at ten. I'<b>ll call</b> you back.</i></li>
<li><b>be going to + 动词原形</b>：已经计划好的事、根据迹象判断。<i>We <b>are going to open</b> a new branch.</i> <i>Look at the clouds. It'<b>s going to rain</b>.</i></li>
<li>否定：<i>will not (won't) + 原形</i>；疑问：<i>Will you…? / Are you going to…?</i></li>
<li>标志词：<i>tomorrow, next week, soon, in two days, later</i></li></ul>
<p>TOEIC 重点：在 <b>if / when / before / after / as soon as</b> 引导的时间、条件从句里，用<b>一般现在时</b>表示将来：<i>I'll call you when the shipment <b>arrives</b>.</i>（不是 will arrive）</p>`,
q:[
{q:"The new branch ___ next month.",o:["opens will","will open","will opens","opened"],a:1,e:"will + 动词原形：will open。"},
{q:"We ___ going to hire two more people.",o:["is","are","will","be"],a:1,e:"be going to，主语 we 用 are。"},
{q:"I'll email you as soon as the results ___ ready.",o:["will be","are","were","be"],a:1,e:"as soon as 引导的时间从句用一般现在时表将来：are。"},
{q:"Don't worry. I ___ help you with the report.",o:["will","am","going","do"],a:0,e:"临时决定、承诺用 will。"},
{q:"Ms. Chen ___ attend the conference tomorrow.",o:["won't","doesn't","didn't","isn't"],a:0,e:"tomorrow 是将来，否定用 won't + 原形。"},
{q:"If it ___ tomorrow, the picnic will be canceled.",o:["will rain","rains","rained","raining"],a:1,e:"if 条件从句用一般现在时表将来。"}]},

{ id:"b_prog", name:"进行时：be + doing", tag:"零基础 · 第 11 课",
intro:`<p>进行时 = <b>be + 动词-ing</b>，表示某一时刻“正在做”。</p>
<ul><li><b>现在进行时</b>：此刻正在做，或最近一段时间在做。<i>She <b>is talking</b> on the phone. We <b>are updating</b> the system this week.</i> 标志词：<i>now, at the moment, currently, Look!</i></li>
<li><b>过去进行时</b>：过去某时刻正在做。<i>I <b>was having</b> lunch when you called.</i></li>
<li>加 -ing：一般直接加；不发音的 e 去掉：<i>make → making</i>；重读闭音节双写：<i>run → running, plan → planning</i></li></ul>
<p>know, like, want, need, belong 等表示状态的词一般不用进行时：<i>I <b>need</b> help now.</i></p>`,
q:[
{q:"Please be quiet. The manager ___ a call now.",o:["takes","is taking","took","take"],a:1,e:"now 表示此刻正在进行，用 is taking。"},
{q:"We ___ the office this week, so it's a little noisy.",o:["renovate","are renovating","renovated","renovates"],a:1,e:"这段时间正在进行，用现在进行时。"},
{q:"I ___ dinner when the phone rang.",o:["have","am having","was having","had had"],a:2,e:"过去某时刻正在做，用过去进行时。"},
{q:"They are ___ a new marketing campaign.",o:["plan","planing","planning","planned"],a:2,e:"plan 双写 n 再加 -ing：planning。"},
{q:"Look! The delivery truck ___.",o:["arrives","is arriving","arrived","arrive"],a:1,e:"Look! 提示正在发生，用现在进行时。"},
{q:"I ___ your help right now.",o:["am needing","need","needs","needing"],a:1,e:"need 表示状态，一般不用进行时。"}]},

{ id:"b_perfect", name:"现在完成时：have + 过去分词", tag:"零基础 · 第 12 课",
intro:`<p>现在完成时 = <b>have / has + 过去分词</b>。它连接过去和现在：过去发生的事对现在有影响，或从过去一直持续到现在。</p>
<ul><li>已经完成：<i>I <b>have finished</b> the report.</i>（现在报告好了）标志词：<i>already, just, yet, ever, never</i></li>
<li>持续到现在：<i>She <b>has worked</b> here <b>for</b> five years / <b>since</b> 2020.</i>（for + 一段时间，since + 起点）</li>
<li>过去分词：规则动词同过去式（worked）；不规则要记：<i>go → gone, see → seen, write → written, take → taken, be → been</i></li></ul>
<p>和一般过去时的区别：有 <i>yesterday, last year, ago</i> 这类具体过去时间，就用一般过去时，不用完成时。</p>`,
q:[
{q:"I have already ___ the invoice.",o:["send","sent","sending","sends"],a:1,e:"have + 过去分词：sent。"},
{q:"Mr. Tanaka ___ worked here since 2019.",o:["have","has","is","was"],a:1,e:"主语单数用 has；since 2019 提示现在完成时。"},
{q:"We have known each other ___ ten years.",o:["since","for","ago","in"],a:1,e:"一段时间前用 for。"},
{q:"She ___ the email two hours ago.",o:["has read","read","have read","has been reading"],a:1,e:"ago 是具体过去时间，用一般过去时。"},
{q:"Have you ever ___ to Canada?",o:["go","went","been","being"],a:2,e:"have been to 表示“去过”。"},
{q:"The shipment hasn't arrived ___.",o:["already","yet","ago","since"],a:1,e:"否定句中“还没”用 yet，放句末。"}]},

{ id:"b_modal", name:"情态动词：can / must / should / may", tag:"零基础 · 第 13 课",
intro:`<p>情态动词给动词加上“能、必须、应该、可能”的语气，后面<b>永远接动词原形</b>，而且不随主语变化（没有 cans、musts）。</p>
<ul><li><b>can / could</b>：能力、许可、请求。<i><b>Could</b> you send me the file?</i>（could 更客气）</li>
<li><b>must</b>：必须（规定）；<b>must not</b> 禁止。<i>Visitors <b>must</b> sign in.</i></li>
<li><b>have to</b>：不得不（客观需要），会随主语变化：<i>She <b>has to</b> work late.</i></li>
<li><b>should</b>：应该、建议。<i>You <b>should</b> check the schedule.</i></li>
<li><b>may / might</b>：可能、许可。<i>The flight <b>may</b> be delayed.</i></li>
<li><b>will / would</b>：请求时 would 更礼貌：<i><b>Would</b> you like some coffee?</i></li></ul>`,
q:[
{q:"All employees must ___ their ID cards.",o:["wear","wears","wearing","to wear"],a:0,e:"情态动词后接动词原形 wear。"},
{q:"___ you help me with this box, please?",o:["Must","Could","Should","May to"],a:1,e:"礼貌请求用 Could you…?"},
{q:"You ___ smoke in the building. It's not allowed.",o:["must not","don't must","mustn't to","not must"],a:0,e:"禁止用 must not + 原形。"},
{q:"She ___ finish the report by five. Her boss needs it.",o:["have to","has to","must to","should to"],a:1,e:"have to 随主语变化，she 用 has to。"},
{q:"The weather is bad, so the flight ___ be late.",o:["may","must to","can to","should to"],a:0,e:"表示可能性用 may + 原形。"},
{q:"You look tired. You ___ take a break.",o:["should","must to","can to","would to"],a:0,e:"给建议用 should + 原形。"}]},

{ id:"b_adj", name:"形容词、副词与比较", tag:"零基础 · 第 14 课",
intro:`<ul><li><b>形容词</b>修饰名词，放在名词前或系动词后：<i>a <b>quick</b> reply / The reply was <b>quick</b>.</i></li>
<li><b>副词</b>修饰动词、形容词或整个句子：<i>reply <b>quickly</b> / <b>very</b> busy / <b>Unfortunately</b>, …</i></li>
<li>形容词变副词：一般加 -ly；辅音+y 变 -ily（easy → easily）；-le 变 -ly（possible → possibly）。<i>fast, hard, late, early</i> 形容词副词同形；<i>good → well</i>。</li>
<li><b>比较级</b>：短词加 -er（cheaper），长词加 more（more expensive），后面跟 <b>than</b>。</li>
<li><b>最高级</b>：the + -est / the most：<i>the <b>cheapest</b> option, the <b>most</b> popular item</i></li>
<li>不规则：<i>good/well → better → best；bad → worse → worst；many/much → more → most；little → less → least</i></li></ul>`,
q:[
{q:"The new system works very ___.",o:["efficient","efficiently","efficiency","more efficient"],a:1,e:"修饰动词 works 用副词 efficiently。"},
{q:"This model is ___ than the old one.",o:["cheap","cheaper","cheapest","more cheap"],a:1,e:"短形容词比较级加 -er，后接 than。"},
{q:"It was the ___ popular product last year.",o:["more","most","much","very"],a:1,e:"长形容词最高级用 the most。"},
{q:"Sales this month are ___ than last month.",o:["good","well","better","best"],a:2,e:"good 的比较级是 better。"},
{q:"The instructions are ___ to follow.",o:["easy","easily","ease","easier than"],a:0,e:"be 后作表语用形容词 easy。"},
{q:"She answered the question ___.",o:["correct","correctly","correction","corrects"],a:1,e:"修饰动词 answered 用副词 correctly。"}]},

{ id:"b_prep", name:"介词：in / on / at 与常用介词", tag:"零基础 · 第 15 课",
intro:`<p><b>时间</b>：从大到小 in → on → at</p>
<ul><li><b>in</b> + 年、月、季节、上午/下午：<i>in 2025, in May, in the morning</i></li>
<li><b>on</b> + 具体某一天：<i>on Monday, on May 5, on the weekend</i>（美式）</li>
<li><b>at</b> + 具体时刻：<i>at 3 p.m., at noon, at night</i></li></ul>
<p><b>地点</b>：<i><b>in</b> the room / in Tokyo</i>（在里面、城市国家）；<i><b>on</b> the desk / on the second floor</i>（在表面、楼层）；<i><b>at</b> the station / at the front desk</i>（在某个点）。</p>
<p>TOEIC 常考：<i>by</i>（截止于；在旁边；通过）<i>Please reply <b>by</b> Friday.</i>；<i>until</i>（一直到）<i>The store is open <b>until</b> nine.</i>；<i>for</i> + 一段时间；<i>during</i> + 名词（在……期间）；<i>within</i> + 时间（在……之内）。</p>`,
q:[
{q:"The conference starts ___ 9 a.m.",o:["in","on","at","by"],a:2,e:"具体时刻用 at。"},
{q:"Our office is ___ the fifth floor.",o:["in","on","at","by"],a:1,e:"楼层用 on。"},
{q:"The new store will open ___ April.",o:["in","on","at","by"],a:0,e:"月份用 in。"},
{q:"Please submit the form ___ Friday.",o:["until","by","at","in"],a:1,e:"“最晚在周五前完成”用 by。"},
{q:"The shop is open ___ 10 p.m. every day.",o:["by","until","during","within"],a:1,e:"持续到某时刻用 until。"},
{q:"Please keep your phone off ___ the meeting.",o:["while","during","for","within"],a:1,e:"during + 名词，表示“在……期间”。while 后接句子。"}]},

{ id:"b_conj", name:"连词：and / but / so / because / although", tag:"零基础 · 第 16 课",
intro:`<p>连词把词或句子连起来，选哪个取决于前后句的<b>逻辑关系</b>。</p>
<ul><li><b>and</b> 并列、<b>but</b> 转折、<b>or</b> 选择、<b>so</b> 结果：<i>It was late, <b>so</b> we took a taxi.</i></li>
<li><b>because</b> 原因（后接句子）；<b>because of</b> 原因（后接名词）：<i>because it rained / because of the rain</i></li>
<li><b>although / though</b> 虽然（接句子）；<b>despite / in spite of</b>（接名词）：<i><b>Although</b> it was expensive, we bought it.</i> 注意英语里 although 和 but 不能同时用。</li>
<li><b>if</b> 如果、<b>unless</b> 除非、<b>when</b> 当……时、<b>while</b> 当……时 / 然而、<b>before / after</b></li>
<li>成对连词：<i>both A and B, either A or B, neither A nor B, not only A but also B</i></li></ul>
<p>判断方法：看空后面接的是<b>句子</b>（有主谓）还是<b>名词</b>，再看意思是转折、因果还是条件。</p>`,
q:[
{q:"The meeting was canceled ___ the manager was sick.",o:["because","because of","although","so"],a:0,e:"后面是完整句子，表原因用 because。"},
{q:"The flight was delayed ___ the heavy snow.",o:["because","because of","although","but"],a:1,e:"后面是名词短语 the heavy snow，用 because of。"},
{q:"___ the price was high, many people bought it.",o:["Because","Although","Despite","So"],a:1,e:"前后是让步（虽然……但）关系，后接句子，用 although。"},
{q:"The store was closed, ___ we went to another one.",o:["because","but","so","although"],a:2,e:"后句是前句的结果，用 so。"},
{q:"You can pay ___ by cash or by credit card.",o:["both","either","neither","not only"],a:1,e:"either A or B：A 或 B 都可以。"},
{q:"___ the rain, the event was a success.",o:["Although","Despite","Because","Unless"],a:1,e:"后面是名词 the rain，表让步用 despite。"}]},

{ id:"b_question", name:"疑问词与否定句", tag:"零基础 · 第 17 课",
intro:`<p><b>特殊疑问句</b> = 疑问词 + 一般疑问句语序。TOEIC 听力 Part 2 全是这类问题，要听清开头的疑问词。</p>
<ul><li><b>What</b> 什么 · <b>Who</b> 谁 · <b>Where</b> 哪里 · <b>When</b> 什么时候 · <b>Why</b> 为什么 · <b>How</b> 怎样</li>
<li><b>How long</b> 多久 · <b>How often</b> 多久一次 · <b>How many / much</b> 多少 · <b>Which</b> 哪一个 · <b>Whose</b> 谁的</li>
<li>语序：<i><b>When does</b> the store <b>open</b>? <b>Where did</b> you <b>put</b> the file? <b>Who is</b> in charge?</i></li></ul>
<p><b>否定句</b>：be 和情态动词后直接加 not；普通动词要借 do / does / did：<i>I <b>don't</b> know. She <b>doesn't</b> agree. We <b>didn't</b> go.</i></p>
<p><b>反义疑问句</b>：前肯后否、前否后肯：<i>You're coming, <b>aren't you</b>? He didn't call, <b>did he</b>?</i></p>`,
q:[
{q:"___ is the meeting? — In Room 302.",o:["When","Where","Who","Why"],a:1,e:"回答是地点，问 where。"},
{q:"___ often do you visit the factory? — Once a month.",o:["How","What","When","Which"],a:0,e:"问频率用 how often。"},
{q:"When ___ the next train leave?",o:["is","does","do","has"],a:1,e:"主语 the next train 单数，普通动词疑问用 does。"},
{q:"She ___ like the new design.",o:["isn't","doesn't","don't","not"],a:1,e:"普通动词 like 的否定借 does not。"},
{q:"You sent the invoice, ___?",o:["did you","didn't you","don't you","weren't you"],a:1,e:"前肯后否，sent 是过去式，用 didn't you。"},
{q:"___ bag is this? — It's Tom's.",o:["Who","Whose","Which","What's"],a:1,e:"问“谁的”用 whose。"}]},

{ id:"b_passive", name:"被动语态入门", tag:"零基础 · 第 18 课",
intro:`<p>主语是动作的<b>承受者</b>时，用被动语态：<b>be + 过去分词</b>。</p>
<ul><li>主动：<i>The staff <b>cleans</b> the room every day.</i> → 被动：<i>The room <b>is cleaned</b> every day.</i></li>
<li>时态体现在 be 上：<i>is/are done（现在）· was/were done（过去）· will be done（将来）· has been done（完成）· is being done（进行）</i></li>
<li>想说“被谁”，用 <b>by</b>：<i>The report was written <b>by</b> Ms. Lee.</i></li></ul>
<p>判断技巧：主语能不能自己做这个动作？<i>The package ___ yesterday.</i> 包裹不会自己送，所以用 <i>was delivered</i>。TOEIC 通知、公告里被动语态非常多：<i>Breakfast <b>is served</b> from 7 to 10.</i></p>`,
q:[
{q:"The package ___ yesterday.",o:["delivered","was delivered","delivers","is delivering"],a:1,e:"包裹是被送达的，过去时被动：was delivered。"},
{q:"Breakfast ___ from 7 to 10 every morning.",o:["serves","is served","served","is serving"],a:1,e:"早餐被供应，现在时被动：is served。"},
{q:"The new policy will ___ next month.",o:["introduce","be introduced","introduced","introducing"],a:1,e:"将来时被动：will be introduced。"},
{q:"The report was written ___ Mr. Wong.",o:["from","by","with","for"],a:1,e:"被动语态中动作执行者用 by 引出。"},
{q:"The manager ___ the proposal last week.",o:["approved","was approved","is approved","approves"],a:0,e:"经理主动批准，主动语态过去时 approved。"},
{q:"All the rooms ___ cleaned already.",o:["have","have been","has been","were being"],a:1,e:"完成时被动：have been + 过去分词，rooms 复数。"}]},

{ id:"b_nonfinite", name:"to do 与 doing", tag:"零基础 · 第 19 课",
intro:`<p>一个句子只有一个谓语动词，其他动词要变成 <b>to do</b>（不定式）或 <b>doing</b>（动名词）。</p>
<ul><li>后面接 <b>to do</b> 的动词：<i>want, need, plan, decide, hope, agree, expect, would like, promise, refuse</i>：<i>We <b>plan to expand</b>.</i></li>
<li>后面接 <b>doing</b> 的动词：<i>enjoy, finish, avoid, consider, suggest, mind, keep, recommend</i>：<i>Would you <b>mind closing</b> the door?</i></li>
<li><b>介词后面</b>一律用 doing：<i>Thank you <b>for coming</b>. / <b>before leaving</b> / <b>interested in joining</b></i></li>
<li>表示目的用 to do：<i>She called <b>to confirm</b> the time.</i></li>
<li>特别注意 <b>look forward to doing</b>（期待），这里的 to 是介词：<i>We look forward to <b>hearing</b> from you.</i></li></ul>`,
q:[
{q:"We decided ___ a new supplier.",o:["find","to find","finding","found"],a:1,e:"decide to do。"},
{q:"Would you mind ___ the window?",o:["open","to open","opening","opened"],a:2,e:"mind doing。"},
{q:"Thank you for ___ our store.",o:["visit","to visit","visiting","visited"],a:2,e:"介词 for 后用动名词 visiting。"},
{q:"I look forward to ___ you next week.",o:["see","seeing","saw","be seen"],a:1,e:"look forward to 的 to 是介词，后接 doing。"},
{q:"He finished ___ the report at six.",o:["write","to write","writing","wrote"],a:2,e:"finish doing。"},
{q:"She went to the bank ___ some money.",o:["withdraw","to withdraw","withdrawing","withdrew"],a:1,e:"表示目的用不定式 to withdraw。"}]},

{ id:"b_clause", name:"从句入门：who / which / that", tag:"零基础 · 第 20 课",
intro:`<p>从句就是“句子里套着的小句子”，最常见的是修饰名词的<b>定语从句</b>，放在名词后面。</p>
<ul><li>修饰人用 <b>who</b>：<i>The woman <b>who</b> called you is my manager.</i></li>
<li>修饰物用 <b>which</b>：<i>The printer <b>which</b> we bought is broken.</i></li>
<li><b>that</b> 人和物都可以：<i>the book <b>that</b> I ordered</i></li>
<li>表示“谁的”用 <b>whose</b>：<i>the client <b>whose</b> order was late</i>；表示地点 <b>where</b>、时间 <b>when</b></li></ul>
<p>另一种常见的是 <b>that 引导的宾语从句</b>：<i>I think <b>that</b> the plan will work.</i>（that 常可省略）；以及 <i>I don't know <b>whether/if</b> he will come.</i></p>
<p>读长句时先找主句的主谓，把从句当成一个“大修饰语”。</p>`,
q:[
{q:"The man ___ is standing by the door is our new CEO.",o:["who","which","whose","where"],a:0,e:"先行词 the man 是人，用 who。"},
{q:"This is the report ___ I told you about.",o:["who","which","whose","where"],a:1,e:"先行词 report 是物，用 which（也可用 that）。"},
{q:"The hotel ___ we stayed was near the station.",o:["which","who","where","when"],a:2,e:"先行词是地点，从句里缺地点状语，用 where。"},
{q:"We contacted the customer ___ package was damaged.",o:["who","whose","which","that"],a:1,e:"“顾客的包裹”，表示所属用 whose。"},
{q:"I think ___ the price is too high.",o:["what","that","which","who"],a:1,e:"宾语从句，内容完整，用 that。"},
{q:"I'm not sure ___ the store is open today.",o:["that","whether","what","which"],a:1,e:"表示“是否”用 whether / if。"}]}
];

/* ============ 工具 ============ */
const $ = (s, r = document) => r.querySelector(s);
